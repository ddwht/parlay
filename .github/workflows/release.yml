name: release

# One release, one tag namespace. The studio-v* workflow is gone with the binary
# it released: parlay-studio is a retirement notice now, and there is no second
# product to version independently. A studio-v* tag pushed today does nothing,
# which is the intended end state.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      # The binary embeds the Vite bundle, so the release needs a Node toolchain.
      # Its absence here is why every released binary shipped an empty dist/ and
      # answered the UI routes with a 503 — goreleaser's before-hooks now run the
      # npm build, and those hooks cannot run without this step.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/editor/ui/package-lock.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # goreleaser publishes the Homebrew formula itself (see `brews:` in
          # .goreleaser.yaml). The hand-rolled heredoc that used to live in this
          # workflow — and identically in release-studio.yml — is gone: it built
          # from a source tarball with no UI bundle, and it stamped the tap
          # owner's username into main.commit.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
