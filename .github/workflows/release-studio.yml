name: release-studio

on:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # studio-v0.1.0 -> 0.1.0
          VERSION="${TAG#studio-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: parlay-studio ${{ steps.ver.outputs.version }}
          generate_release_notes: true

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          SHA=$(curl -sL "https://github.com/ddwht/parlay/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)

          FORMULA=$(cat <<RUBY
          class ParlayStudio < Formula
            desc "Parlay Studio — designer-facing extension to parlay (Domain Model Editor, Design Loop skill)"
            homepage "https://github.com/ddwht/parlay"
            url "https://github.com/ddwht/parlay/archive/refs/tags/${TAG}.tar.gz"
            version "${VERSION}"
            sha256 "${SHA}"
            license "MIT"

            depends_on "go" => :build
            depends_on "parlay"

            def install
              cd "studio" do
                ldflags = %W[
                  -s -w
                  -X main.version=#{version}
                  -X main.commit=#{tap.user}
                ]
                system "go", "build", *std_go_args(ldflags:), "./cmd/parlay-studio"
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/parlay-studio version")
            end
          end
          RUBY
          )

          # Clone the existing tap, update parlay-studio.rb, push.
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ddwht/homebrew-parlay.git" tap
          mkdir -p tap/Formula
          echo "$FORMULA" > tap/Formula/parlay-studio.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/parlay-studio.rb
          git commit -m "Update parlay-studio to ${TAG}" || echo "No changes"
          git push
