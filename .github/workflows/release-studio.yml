name: release-studio

on:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # studio-v0.1.0 -> 0.1.0
          VERSION="${TAG#studio-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser (studio)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.studio.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override the version goreleaser computes from the tag, since
          # our scheme is studio-v* rather than v*. Goreleaser would
          # otherwise produce a malformed Version template from "studio-v0.1.0".
          GORELEASER_CURRENT_TAG: "v${{ steps.ver.outputs.version }}"

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          SHA=$(curl -sL "https://github.com/ddwht/parlay/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)

          FORMULA=$(cat <<RUBY
          class ParlayStudio < Formula
            desc "Parlay Studio — designer-facing extension to parlay (Domain Model Editor, Design Loop skill)"
            homepage "https://github.com/ddwht/parlay"
            url "https://github.com/ddwht/parlay/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA}"
            license "MIT"

            depends_on "go" => :build
            depends_on "parlay"

            def install
              cd "studio" do
                ldflags = %W[
                  -s -w
                  -X main.version=#{version}
                  -X main.commit=#{tap.user}
                ]
                system "go", "build", *std_go_args(ldflags:), "./cmd/parlay-studio"
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/parlay-studio version")
            end
          end
          RUBY
          )

          # Clone the existing tap, update parlay-studio.rb, push.
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ddwht/homebrew-parlay.git" tap
          mkdir -p tap/Formula
          echo "$FORMULA" > tap/Formula/parlay-studio.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/parlay-studio.rb
          git commit -m "Update parlay-studio to ${TAG}" || echo "No changes"
          git push
