feature: design-loop/design-loop
adapter-set: parlay-studio

# Skill-shaped feature — the first one in this project. The runtime artifact
# is a parlay-skill markdown file plus two embedded schema markdown files;
# none of those creates land inside the active studio root.
#
# All three planned creates are cross-root:
#
#   - .claude/skills/parlay-design-loop/SKILL.md            (repo-level root)
#   - core/internal/embedded/schemas/design-loop-result.schema.md      (core root)
#   - core/internal/embedded/schemas/design-loop-conflicts.schema.md   (core root)
#
# `parlay check-buildfile` derives the buildfile's source root from the
# buildfile path: this file lives under `studio/.parlay/build/...` so the
# source root is `studio/`. Cross-root paths cannot legally appear in
# `target-files`, `target-creates`, or `plan.creates`.
#
# Approach A (matches the architectural-prose-artifact precedent for the
# repo-level CLAUDE.md): the cross-root file list is carried in the
# cross-cutting entry's `transform:` prose. The code phase is responsible
# for writing those paths via direct file primitives (Write tool); they are
# intent-level write commitments, not check-buildfile-gated targets.
#
# There is also one in-studio anchor change that does fit within the active
# root: the new layout-schema `figma:` block lives in
# `core/internal/embedded/schemas/layout.schema.md` (cross-root, in transform
# prose) AND its on-disk presence is reachable from studio at runtime via
# the deployed `.parlay/schemas/layout.schema.md`. That deployed copy is
# regenerated by `parlay upgrade` from the embedded source — exactly the
# same propagation mechanism the architectural-prose-artifact feature
# documented for the parent CLAUDE.md.
#
# Consequence for plan integrity: each cross-cutting entry below carries
# zero in-studio target paths and zero plan rows. `check-buildfile` will
# report `cross-cutting-not-in-plan` for each entry. The build skill's
# Step 10 disposition is "Accept and document" — this is a known gap in
# the parlay-tool layer (finding #5 from the prior precedent) and a
# follow-up parlay-tool feature is needed to formally support skill-shaped
# features whose creates land outside the active root.

fixtures: {}

routes: []

components: {}

cross-cutting:
  # ---------------------------------------------------------------------------
  # Fragment 1: Design Loop runtime is a parlay-skill, not Studio binary code
  # ---------------------------------------------------------------------------
  - id: design-loop-is-a-parlay-skill
    source: "@design-loop/design-loop/design-loop-is-a-parlay-skill-executed-by-the-host-agent"
    # Cross-root path: ../ escapes the studio source-root and reaches the
    # repo-level .claude/skills tree where Claude Code reads the skill
    # surface. filepath.Join in `check-buildfile` cleans the `..` segment
    # into the parent of studio/, which IS where this file lives at the
    # repo root.
    target-creates:
      - "../.claude/skills/parlay-design-loop/SKILL.md"
    transform: |
      Author one new parlay-skill markdown file whose content instructs the
      host agent's LLM how to perform the Design Loop's round-trip for a
      given feature. The skill ships project-local for v1; a future
      deployment mechanism (analogous to `parlay upgrade`) is reserved for
      a separate Studio feature.

      CROSS-ROOT WRITE TARGET (not in plan.creates because it is outside
      the active studio root; the code phase MUST write it directly via
      Write/Edit primitives):
        - .claude/skills/parlay-design-loop/SKILL.md (repo-level path)

      Required skill source structure (drives Suite 1 verification):
        - Top-level heading naming the skill (e.g. `# Design Loop` or
          `# Parlay Design Loop`).
        - A "Description" or opening prose paragraph stating that the skill
          performs the Studio Design Loop round-trip via the host agent's
          Figma MCP connection.
        - An "## Arguments" section listing exactly ONE argument: a
          feature reference (e.g. `@<initiative>/<feature>`). No Figma URL
          flag, no token flag, no endpoint flag.
        - A "## Steps" section presenting a numbered list with at least
          EIGHT ordered steps (the round-trip orchestration; the exact
          step contract is carried in cross-cutting/tool-call-orchestration
          below).
        - An explicit "Excluded in v1" block enumerating the v1-excluded
          Figma MCP tool names (`get_design_context`, `get_screenshot`,
          `generate_diagram`, `get_figjam`, `create_design_system_rules`,
          `search_design_system`, `generate_figma_design`) with the
          v1-exclusion rationale carried forward from the retracted
          figma-mcp-client feature.

      Strict content invariants (drive Suite 1 grep tests):
        - The skill source contains zero references to any Studio Go
          package (no `studio/internal/`), zero Go function call shapes,
          zero Go language keywords. The whole file is markdown
          instructions for the host LLM.
        - The skill source contains zero references to `mcp.figma.com`,
          OAuth keywords (`oauth`, `bearer`, `client_id`, `client_secret`),
          bearer-token language, or `STUDIO_FIGMA_*` environment variables.
          All Figma authentication is deferred to the host agent's
          existing Figma MCP connection.
        - The skill source references every tool name in the SUPPORTED
          subset at least once OUTSIDE the "Excluded in v1" block:
          `use_figma`, `create_new_file`, `add_code_connect_map`,
          `send_code_connect_mappings`, `get_metadata`,
          `get_code_connect_map`, `get_code_connect_suggestions`,
          `whoami`.
        - The skill source references every v1-EXCLUDED tool name ONLY
          inside the explicit "Excluded in v1" block.

      Skill name: `parlay-design-loop` (unadorned). A Studio-specific
      prefix was considered for disambiguation against a hypothetical
      future Core skill of the same name and rejected as premature; the
      rename happens when (and if) a Core skill ever claims the slot.

      Host-agent neutrality: the skill prompt is host-agnostic in
      wording. Claude Code is the only host validated for v1, but the
      prompt does not assume Claude Code specifics — it speaks to "the
      host agent's Figma MCP tool surface" generically.
    introduces:
      - "Project-local parlay-skill at .claude/skills/parlay-design-loop/SKILL.md"
    caching: none
    backward-compatible: true

  # ---------------------------------------------------------------------------
  # Fragment 2: On-disk artifact contract — inputs, outputs, schemas
  # ---------------------------------------------------------------------------
  - id: on-disk-artifact-contract
    source: "@design-loop/design-loop/on-disk-artifact-contract-between-studio-binary-and-design-loop-skill"
    # Cross-root paths: ../core/... escapes the studio source-root and
    # reaches the core sibling root where the embedded schemas live.
    # Two new schema docs to create, one existing schema doc to modify.
    target-files:
      - "../core/internal/embedded/schemas/layout.schema.md"
    target-creates:
      - "../core/internal/embedded/schemas/design-loop-result.schema.md"
      - "../core/internal/embedded/schemas/design-loop-conflicts.schema.md"
    transform: |
      Pin the exact set of files the Design Loop skill reads and writes,
      and author the two YAML schema docs that describe the output
      shapes. Extend the layout schema with a `figma:` metadata block.

      CROSS-ROOT WRITE TARGETS (not in plan.creates / plan.modifies
      because all paths are outside the active studio root; the code
      phase MUST write them directly via Write/Edit primitives):

      Creates:
        - core/internal/embedded/schemas/design-loop-result.schema.md
        - core/internal/embedded/schemas/design-loop-conflicts.schema.md

      Modifies:
        - core/internal/embedded/schemas/layout.schema.md
            Adds an optional top-level `figma:` block with at least a
            `file_url:` field. Existing layout YAMLs without the block
            MUST continue to validate clean — the field is optional so
            read-only Domain Model Editor use stays unaffected.

      Skill-source content carried in the same code phase (the skill
      source is created under cross-cutting/design-loop-is-a-parlay-skill
      above; the artifact-contract content extends that same file):

        The skill source MUST name the three input artifacts:
          - the feature's page schema (`<page>.page.md` under
            spec/intents/<feature>/)
          - the layout YAML referenced by the page schema (its `figma:`
            block carries the per-feature Figma file URL)
          - the design-system vocabulary resolved through the adapter
            config per @design-loop/vocabulary-validation

        The skill source MUST name the three output artifacts:
          - `design-loop-result.yaml` (unconditional write — node IDs,
             component identities, timestamp)
          - `design-loop-conflicts.yaml` (conditional — only when
             conflicts are detected)
          - the layout YAML itself (conditional — only when in-vocabulary
             designer changes were merged back)

        The skill source MUST instruct atomic writes (write-temp +
        rename) coordinated across the three output artifacts so a
        reader cannot observe a partial state. Grep targets: "atomic" or
        "write-temp" in the skill source.

      Result-schema content (`design-loop-result.schema.md`):
        - Documents the YAML shape produced on every successful loop.
        - Declares at minimum the top-level fields:
            * `loop-timestamp:` (ISO 8601 timestamp)
            * `figma-file-url:` (the URL the loop targeted)
            * `nodes:` (list of read-back node entries, each carrying at
              least a `figma-node-id:`, a `component-identity:` resolving
              to the design-system vocabulary's component name, and a
              `canonical-layout-path:` linking the node back to its
              position in the canonical layout tree)
        - Framework-agnostic prose only — no Go types, no TypeScript,
          no language-specific representation.

      Conflicts-schema content (`design-loop-conflicts.schema.md`):
        - Documents the YAML shape written ONLY when conflicts are
          detected during read-back (out-of-vocabulary edits,
          pre-flight failures, silent drops in step 5/6 reconciliation).
        - Declares at minimum the top-level fields:
            * `loop-timestamp:` (matches the result's timestamp on the
              same loop)
            * `entries:` (list of per-conflict entries, each carrying
              at least a `kind:` enum (`pre-flight-vocabulary-failure`,
              `out-of-vocabulary-node`, `silent-drop`,
              `tool-call-failure`), a `figma-node-id:` when applicable,
              a `reason:` string, and a `canonical-layout-path:` when
              applicable)
        - Framework-agnostic prose only.

      Per-feature Figma URL location: the URL lives in the layout YAML's
      `figma:` block. NOT in `studio-config.yaml`, NOT in any environment
      variable, NOT in the page schema's root. Different features
      routinely operate on different Figma files; the URL is a per-
      feature concern, not a global one.

      v1 `figma:` block contents: only `file_url:`. `team_url:` and
      per-node Figma node IDs were considered and deferred — pinning
      speculative fields before the first round-trip produces real data
      forces premature schema revision. Once `design-loop-result.yaml`
      actually carries node IDs from a real round-trip, a follow-up
      feature can extend the `figma:` block to persist them.
    introduces:
      - "core/internal/embedded/schemas/design-loop-result.schema.md (new schema doc)"
      - "core/internal/embedded/schemas/design-loop-conflicts.schema.md (new schema doc)"
      - "Optional top-level `figma:` block in core/internal/embedded/schemas/layout.schema.md"
    caching: none
    backward-compatible: true

  # ---------------------------------------------------------------------------
  # Fragment 3: Tool-call orchestration — the eight-step round-trip
  # ---------------------------------------------------------------------------
  - id: tool-call-orchestration
    source: "@design-loop/design-loop/tool-call-orchestration-read-back-and-conflict-detection"
    # Same cross-root SKILL.md file as cross-cutting/design-loop-is-a-
    # parlay-skill. This entry refines the Steps subsection of the same
    # file; the file is created once and both entries contribute content.
    # Listed in target-files (not target-creates) so check-buildfile
    # routes this entry to plan.modifies — the file is genuinely
    # introduced by the sibling entry, but THIS entry only extends it.
    # The kind heuristic stats the path on disk: pre-code-phase the file
    # does not exist, so the entry classifies as "purely-introducing"
    # and routes to plan.creates. Both entries land on the same path
    # there; the plan.creates row carries both as sources.
    target-files:
      - "../.claude/skills/parlay-design-loop/SKILL.md"
    transform: |
      Author the skill source's Steps section so it presents the round-
      trip as an ORDERED eight-step sequence. Same cross-root target as
      cross-cutting/design-loop-is-a-parlay-skill — this entry refines
      the Steps subsection of the same SKILL.md file.

      CROSS-ROOT WRITE TARGET (shared with cross-cutting/design-loop-is-
      a-parlay-skill; not in plan.creates because it is outside the
      active studio root):
        - .claude/skills/parlay-design-loop/SKILL.md

      Required step-by-step content (each step names its inputs, outputs,
      and the MCP tool calls it makes; the skill source MUST present
      them in this order without branching that skips or reorders):

        Step 1 — Read inputs.
          Inputs: feature reference (the skill's single argument).
          The skill reads the three input artifacts: the page schema,
          the layout YAML (including its `figma:` block), and the
          design-system vocabulary resolved through the adapter config
          per @design-loop/vocabulary-validation.
          MCP tools used: none.
          Outputs: in-memory representations of the three inputs.

        Step 2 — Pre-flight vocabulary validation.
          Run @design-loop/vocabulary-validation against the layout
          YAML. If the layout itself violates the vocabulary, ABORT
          early: write only `design-loop-conflicts.yaml` documenting
          the validation failure (`kind: pre-flight-vocabulary-failure`)
          and make ZERO Figma tool calls. Steps 3-7 are skipped on
          pre-flight failure. No `design-loop-result.yaml` is written
          because the loop never reached Figma.
          MCP tools used: none.

        Step 3 — Read current Figma state.
          Call `get_metadata` against the Figma file URL from the
          layout's `figma:` block. Capture the current node hierarchy,
          component identities, and bindings.
          If `get_metadata` returns an error (Figma API down, file URL
          invalid, host MCP not configured), the skill stops; no writes
          to Figma have happened, so no rollback is needed. Write a
          `design-loop-conflicts.yaml` entry of `kind: tool-call-failure`
          naming the tool and the error. No `design-loop-result.yaml`.
          MCP tools used: get_metadata.

        Step 4 — Compute the canonical-vs-Figma diff.
          Compare the canonical layout YAML against the current Figma
          state captured in step 3. Classify into four buckets:
          additions (layout has, Figma doesn't), removals (Figma has,
          layout doesn't, AND the node is one the loop previously
          created), modifications (both have, properties differ), and
          designer-authored novelties (Figma has, layout doesn't, AND
          the node is NOT one the loop previously created).
          MCP tools used: none.

        Step 5 — Apply canonical-layout changes to Figma. RIGID ORDER.
          (5a) `use_figma` — apply component instantiation and layout
               edits derived from step 4's additions and modifications.
               If step 4 produced zero edits, the skill calls `use_figma`
               with an EMPTY edit set rather than skipping. Determinism
               over smartness.
          (5b) `add_code_connect_map` — establish Code Connect bindings
               for any new components.
          (5c) `send_code_connect_mappings` — push the bindings to
               Figma.
          Write order is rigid: ALWAYS use_figma → add_code_connect_map
          → send_code_connect_mappings. The skill does NOT branch on
          the diff to skip or reorder.
          A `use_figma` mid-sequence failure does NOT retry. The skill
          proceeds to step 6 to capture whatever state Figma ended up
          in; the failed edit appears in `design-loop-conflicts.yaml`
          as a `kind: tool-call-failure` entry.
          MCP tools used: use_figma, add_code_connect_map,
          send_code_connect_mappings.

        Step 6 — Read post-write state. MANDATORY ON EVERY LOOP.
          Call `get_metadata` again. The skill does NOT skip step 6
          when step 4's diff was empty — the read-back is what makes
          drift detectable. Compare the post-write state to the
          expected state computed from steps 4+5. Any node that step 5
          reported as successful but step 6 didn't observe is recorded
          as a `kind: silent-drop` entry in
          `design-loop-conflicts.yaml`.
          MCP tools used: get_metadata.

        Step 7 — Classify designer-authored novelties.
          For each novelty captured in step 4, invoke @design-loop/
          vocabulary-validation exactly ONCE. In-vocabulary edits stage
          for merge-back into the canonical layout YAML; out-of-
          vocabulary edits stage for `design-loop-conflicts.yaml` as
          `kind: out-of-vocabulary-node` entries. The classifier's
          output drives the merge-back vs refuse-and-warn decision
          deterministically.
          MCP tools used: none.

        Step 8 — Write outputs atomically.
          Write the three output artifacts atomically: write-temp +
          rename, coordinated across `design-loop-result.yaml`,
          `design-loop-conflicts.yaml` (only if any conflicts were
          staged), and the updated layout YAML (only if any
          in-vocabulary merge-backs were staged). A reader cannot
          observe a partial state.
          MCP tools used: none.

      Determinism contract reiterated in the skill prompt: the same
      inputs plus the same Figma state should produce the same tool-
      call sequence on every invocation. This is what makes fixture
      tests (recorded MCP transcripts) viable.

      Excluded-tool block (carried forward from figma-mcp-client's
      retracted scoping work, listed verbatim in the skill source):
      `get_design_context`, `get_screenshot`, `generate_diagram`,
      `get_figjam`, `create_design_system_rules`, `search_design_system`,
      `generate_figma_design`. The rationale is "not required for v1
      round-trip; v1 ships the smallest sufficient subset, and each
      excluded tool can be admitted by a separate future feature with
      its own scoping rationale."
    introduces:
      - "Numbered Steps section in .claude/skills/parlay-design-loop/SKILL.md (eight ordered steps)"
      - "Excluded-in-v1 block in the skill source naming each v1-excluded MCP tool"
    caching: none
    backward-compatible: true

# No wiring rules (no layout-bearing pages in this feature — the feature
# IS the design-loop skill itself; it does not have a Studio UI page).
# No bindings (no layout-bearing pages in this feature).

plan:
  # All paths use `../` to escape the studio source-root. check-buildfile
  # cleans the segment via filepath.Join; the resolved absolute path
  # points at the actual on-disk location (either the repo-level
  # .claude/ tree or the core sibling root).
  #
  # Routing:
  #   - SKILL.md is a new file (purely-introducing) → plan.creates with
  #     both fragment-1 and fragment-3 as sources (fragment 1 introduces
  #     the file shape; fragment 3 contributes the Steps section).
  #   - The two new schema docs are purely-introducing → plan.creates
  #     under cross-cutting/on-disk-artifact-contract (via target-creates).
  #   - layout.schema.md exists on disk and is being modified →
  #     plan.modifies under cross-cutting/on-disk-artifact-contract
  #     (via target-files).
  modifies:
    - path: "../core/internal/embedded/schemas/layout.schema.md"
      sources:
        - cross-cutting/on-disk-artifact-contract
  creates:
    - path: "../.claude/skills/parlay-design-loop/SKILL.md"
      sources:
        - cross-cutting/design-loop-is-a-parlay-skill
        - cross-cutting/tool-call-orchestration
    - path: "../core/internal/embedded/schemas/design-loop-result.schema.md"
      sources:
        - cross-cutting/on-disk-artifact-contract
    - path: "../core/internal/embedded/schemas/design-loop-conflicts.schema.md"
      sources:
        - cross-cutting/on-disk-artifact-contract
  deletes: []
  # Multi-target shape: every write in this feature targets either the
  # repo-level agent surface (.claude/) or the core sibling root. None of
  # the writes land in the presentation slot (studio/internal/ui/) or the
  # application slot (studio/internal/, studio/cmd/). The legacy flat
  # block above carries the canonical list; the per-target block below
  # is intentionally empty for both slots because this feature's emissions
  # cross the studio boundary entirely.
  targets:
    presentation:
      modifies: []
      creates: []
      deletes: []
    application:
      modifies: []
      creates: []
      deletes: []

