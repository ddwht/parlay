# Application adapter for Parlay Studio's Go backend.
# Owns: HTTP server harness (chi), domain editor business logic,
# design loop coordinator, MCP client wrapper, and YAML file I/O.
# This adapter intentionally does not split transport from application —
# Studio's HTTP surface is small and tightly coupled to the editor logic
# (see studio-foundation/figma-mcp-client and the architecture notes).

name: go-studio-app
framework: "Go (chi + go-mcp-sdk + yaml.v3)"
version: "1.0"
kind: application

# --- Supports contract ---
# Studio's domain operations are local: no auth, no permissions, no
# unauthorized/forbidden errors. transaction-required maps to atomic YAML
# writes (write-temp-then-rename) for the persistence steps.
supports:
  operation_kinds:
    - command
    - query
  steps:
    - validate-input
    - create-one
    - update-one
    - delete-one
    - read-one
    - read-many
    - search
    - return-one
    - return-many
    - return-empty
  policies:
    - transaction-required
  errors:
    - validation-failed
    - not-found
    - conflict
    - server-error

# --- File conventions ---
file-conventions:
  source-root: "studio/"
  component-pattern: "internal-package-per-subsystem"
  naming: "snake_case"
  entry-point: "studio/cmd/parlay-studio/main.go"

# --- Conventions ---
conventions:
  package-layout:
    rule: |
      Top-level layout is fixed:
        studio/cmd/parlay-studio/main.go         — entry point; wires the harness, registers handlers, blocks on signal
        studio/internal/server/                  — chi router, middleware, JSON encoding, error envelopes
        studio/internal/mcpclient/               — Figma MCP client wrapper (sole importer of github.com/modelcontextprotocol/go-sdk)
        studio/internal/domain/                  — domain-model.yaml read/write, validation, change events
        studio/internal/designloop/              — Design Loop coordinator (canonical layout <-> Figma round-trip)
        studio/internal/ui/                      — embedded React+Vite bundle (//go:embed dist/*)
        studio/internal/files/                   — atomic YAML I/O against Core artifact paths
      No package outside this layout. Cross-package imports flow downward
      (server -> domain/designloop/mcpclient/files); no upward imports.
    applies-to: "all generated packages"
  step-to-method-mapping:
    rule: |
      validate-input -> a per-operation Validate(ctx, input) method that returns
        a typed error tree; the server middleware translates to validation-failed.
      authorize -> not used (no policy declared).
      create-one/update-one/delete-one -> per-entity methods on a Repo type
        (e.g. EntityRepo.CreateOne); writes go through internal/files for atomicity.
      read-one/read-many/search -> Repo methods returning pointer/slice + error.
      return-* -> server handler binds the Repo result to the JSON envelope.
    applies-to: "every operation step"
  policy-to-implementation-mapping:
    rule: |
      transaction-required -> the operation runs inside an atomicYAMLWrite block:
        files.WriteAtomic writes to <path>.tmp, fsyncs, then renames over the
        target. Multi-file operations stage all .tmp paths first, then rename
        in a deterministic order; failure during rename leaves the project in
        a recoverable state (next Studio start sweeps stale .tmp).
    applies-to: "every operation policies: list"
  error-to-status-mapping:
    rule: |
      validation-failed -> 400 with {code, fields[]} envelope.
      not-found         -> 404 with {code, target} envelope.
      conflict          -> 409 with {code, current_etag, attempted_etag} envelope.
      server-error      -> 500 with {code, request_id} envelope; the underlying
                            error is logged with request_id but never returned.
      Every handler wraps internal errors with %w so the error-mapping
      middleware can errors.As/Is to translate.
    applies-to: "every operation's errors: list"
  http-routing:
    rule: |
      chi router with one Route group per subsystem:
        /api/domain-model/...   -> internal/domain handlers
        /api/design-loop/...    -> internal/designloop handlers
        /api/health             -> liveness probe
        /                       -> serves the embedded UI bundle (SPA fallback to /index.html)
      JSON only (Content-Type: application/json). No multipart, no XML.
      Request IDs are generated by chi/middleware.RequestID and surfaced in
      every response envelope and log line.
    applies-to: "all server-bound code"
  mcp-client-isolation:
    rule: |
      All MCP traffic flows through internal/mcpclient. No other package
      imports github.com/modelcontextprotocol/go-sdk. The wrapper exposes
      one named method per supported Figma tool (use_figma, get_metadata,
      get_code_connect_map, whoami) and rejects unsupported tool names with
      a typed error. See studio/spec/intents/studio-foundation/figma-mcp-client.
    applies-to: "all MCP-touching code"
  file-io:
    rule: |
      All disk writes go through internal/files. Reads may go through any
      package but should use internal/files when the read must be paired with
      an atomic write. Direct os.Create/os.WriteFile outside internal/files
      is forbidden — it bypasses the atomic-write contract.
    applies-to: "all disk-touching code"
  error-handling:
    rule: |
      Wrap with fmt.Errorf("...: %w", err). Sentinel errors live in the
      package that defines the error condition (e.g. domain.ErrEntityNotFound).
      Never return raw third-party errors across package boundaries — wrap
      at the boundary so callers can errors.Is/As against package-local sentinels.
      panic() is reserved for impossible states; recovered at the chi middleware
      boundary and surfaced as server-error.
    applies-to: "all generated Go code"
  context:
    rule: |
      Every exported function that does I/O (HTTP, file, MCP) takes a
      context.Context as its first parameter. Cancellation propagates through
      to the underlying client. context.Background() appears only in main and
      in tests; package-internal code receives context from its caller.
    applies-to: "all I/O-bound functions"
  testing:
    rule: |
      Standard library testing package. _test.go files live alongside the code
      they test. Table-driven tests via t.Run subtests. Fixture files under
      package_test/testdata. No third-party assertion libraries (no testify,
      no gomega) — keep the test surface minimal and the failure messages
      explicit. Integration tests that touch the Figma MCP server are tagged
      with //go:build integration and skipped by default.
    applies-to: "all _test.go files"
  embedding:
    rule: |
      The React UI bundle is embedded via //go:embed in studio/internal/ui/embed.go.
      The build pipeline runs `npm run build` in studio/internal/ui/ before
      `go build` so dist/ exists at compile time. The embed directive is the
      single integration point between the TS and Go halves of the binary.
    applies-to: "studio/internal/ui/embed.go"
  go-module:
    rule: |
      Studio is a separate Go module under studio/go.mod. It depends on the
      official MCP SDK at an exact version (no caret/tilde). It does not
      import core/internal/* — only future core/pkg/* once Core publishes a
      stable surface (per architecture P1).
    applies-to: "studio/go.mod"
