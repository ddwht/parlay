feature: domain-model-editor-mvp

fragments:
  - name: Entity list
    shows: data-list, empty-state
    actions: invoke, invoke-destructive, navigate-drill, select-one
    source: "@domain-model-editor-mvp/entity-and-field-editing"
    verify:
      - 'A UI-level test creates an entity `Order` with fields `id: uuid required` and `status: <enum>` and asserts the resulting in-memory model matches the schema''s documented shape, including the auto-set `enum:` key'
      - A test renames `Customer` to `Client` in a model where `Order.customer_id` is `ref → Customer` and a relationship names `Customer`, and asserts both the field target and the relationship endpoint now read `Client` with no intermediate dangling state
      - A test attempts to delete `Customer` while `Order.customer_id` targets it and asserts the delete is blocked with a message naming `Order.customer_id`; after retyping the field to `string`, the delete succeeds
      - A test asserts the type dropdown for a model with enums `OrderStatus` and `Priority` offers exactly the seven closed scalar types plus `ref` plus those two enum names
      - A test creates a second entity named `Order` and asserts a field-level duplicate-name rejection before any save round-trip
      - A test reorders fields within an entity, saves, and asserts the serialized YAML lists the fields in the new order
    page: Domain Model Editor
    region: sidebar
    order: 10
    notes:
      - Lists the model's entities; selecting one opens its form panel in the main region.
      - New-entity requires a name unique within the model; delete is blocked while the entity is referenced (see the form panel's block message).
      - Empty-state is the fresh-project entry point — no domain-model.yaml on disk yet.

  - name: Enum list
    shows: data-list, empty-state
    actions: invoke, invoke-destructive, navigate-drill, select-one
    source: "@domain-model-editor-mvp/enum-editing"
    verify:
      - A test creates enum `OrderStatus` with values `pending` (label "Pending", tone `warning`) and `paid` (tone `success`), and asserts the serialized YAML matches the schema's documented shape with no empty-string keys for unset options
      - A test renames `OrderStatus` to `Status` while `Order.status` references it and asserts the field's `type:` and `enum:` keys both read `Status` afterward
      - A test attempts to delete a referenced enum and asserts the block message names the referencing fields; deleting an unreferenced enum succeeds
      - A test attempts to name an enum `string` and asserts a field-level rejection naming the collision with the scalar type vocabulary
      - A test adds a duplicate value `pending` to an enum and asserts a field-level rejection before save
      - A test asserts the tone selector offers exactly the five closed tones plus none, each with a visual preview
    page: Domain Model Editor
    region: sidebar
    order: 20
    notes:
      - Lists the model's enums; selecting one opens its form panel.
      - New-enum names must be unique and must not collide with the closed scalar type vocabulary.

  - name: Entity form panel
    shows: data-value, message
    actions: provide-text, provide-structured-input, select-one, select-toggle, reorder, invoke, invoke-destructive
    source: "@domain-model-editor-mvp/entity-and-field-editing"
    verify:
      - 'A UI-level test creates an entity `Order` with fields `id: uuid required` and `status: <enum>` and asserts the resulting in-memory model matches the schema''s documented shape, including the auto-set `enum:` key'
      - A test renames `Customer` to `Client` in a model where `Order.customer_id` is `ref → Customer` and a relationship names `Customer`, and asserts both the field target and the relationship endpoint now read `Client` with no intermediate dangling state
      - A test attempts to delete `Customer` while `Order.customer_id` targets it and asserts the delete is blocked with a message naming `Order.customer_id`; after retyping the field to `string`, the delete succeeds
      - A test asserts the type dropdown for a model with enums `OrderStatus` and `Priority` offers exactly the seven closed scalar types plus `ref` plus those two enum names
      - A test creates a second entity named `Order` and asserts a field-level duplicate-name rejection before any save round-trip
      - A test reorders fields within an entity, saves, and asserts the serialized YAML lists the fields in the new order
    page: Domain Model Editor
    region: main
    order: 10
    notes:
      - Per-entity form — entity name plus inline field rows. Each field row has a name, a type chosen from a dropdown (the closed scalar set plus `ref` plus declared enum names — free-text type entry does not exist), a required toggle, and a conditional companion control.
      - Selecting `ref` requires choosing a target from declared entities before the field commits; selecting an enum name auto-sets the `enum:` companion key.
      - Field rows are reorderable; declaration order is designer-controlled and preserved to the file.
      - Rename propagates atomically to every referencing `ref` target and relationship endpoint; delete is blocked while referenced, with the referents enumerated in a message.
      - Duplicate entity/field names are rejected at entry with a field-level message, not on save.

  - name: Enum form panel
    shows: data-value, status, message
    actions: provide-text, select-one, reorder, invoke, invoke-destructive
    source: "@domain-model-editor-mvp/enum-editing"
    verify:
      - A test creates enum `OrderStatus` with values `pending` (label "Pending", tone `warning`) and `paid` (tone `success`), and asserts the serialized YAML matches the schema's documented shape with no empty-string keys for unset options
      - A test renames `OrderStatus` to `Status` while `Order.status` references it and asserts the field's `type:` and `enum:` keys both read `Status` afterward
      - A test attempts to delete a referenced enum and asserts the block message names the referencing fields; deleting an unreferenced enum succeeds
      - A test attempts to name an enum `string` and asserts a field-level rejection naming the collision with the scalar type vocabulary
      - A test adds a duplicate value `pending` to an enum and asserts a field-level rejection before save
      - A test asserts the tone selector offers exactly the five closed tones plus none, each with a visual preview
    page: Domain Model Editor
    region: main
    order: 20
    notes:
      - Per-enum form — value rows with a raw value, an optional label, and a tone selector.
      - The tone selector offers exactly the closed set {neutral, info, warning, danger, success} plus "none"; each option renders as its actual badge treatment (the `status` show) so the designer picks by appearance.
      - Unset label/tone are omitted from the serialized YAML, never written as empty strings.
      - Value rows are unique on value and reorderable; rename propagates to referencing fields; delete is blocked while referenced.

  - name: Save bar
    shows: status, message
    actions: invoke
    source: "@domain-model-editor-mvp/editor-ui-shell-as-the-first-embedded-ui-bundle-consumer"
    verify:
      - A build-integration test builds the bundle, boots the harness with it embedded, fetches `/` and asserts the editor shell HTML is served (the 503 `studio-ui-bundle-not-built` envelope no longer occurs)
      - A UI test edits a field, asserts the save bar shows dirty state, saves, and asserts the bar returns to clean with a last-saved timestamp
      - A UI test receives a 409 on save and asserts the reload-and-reapply prompt appears, reload refetches the model with a fresh etag, and no second save fires without designer action
      - A UI test receives a `validation-failed` envelope and asserts each `fields[]` entry renders at its form control, not only as a toast
      - A UI test simulates connection refusal after a successful session and asserts the session-ended screen appears with the restart command
      - A UI test navigates to an unknown route and asserts the shell renders (no browser-level 404), while a fetch to an unknown `/api/*` path still surfaces the harness's `not-found` envelope
    page: Domain Model Editor
    region: footer
    order: 10
    notes:
      - Sticky save bar tracking dirty state across all editor panels — any uncommitted in-memory edit shows the Save affordance; saving shows progress; a clean state shows the last-saved time.
      - A beforeunload warning fires while the draft is dirty.
      - Save flows through the subsystem's compare-and-swap write endpoint, whose etag mechanics are pinned in the infrastructure compare-and-swap-save fragment.

  - name: Done control
    shows: message
    actions: invoke, confirm, dismiss
    source: "@domain-model-editor-mvp/blocking-domain-edit-invocation-for-agent-handoff"
    verify:
      - A subcommand test boots `domain-edit` with injected fakes and asserts the browser-open hook receives the bound URL suffixed with `/domain-model`, while the bare invocation's hook receives the root URL
      - A test drives a `domain-edit` session, fires the Done control with a clean draft, and asserts the explicit-shutdown trigger fires, the process exits zero, and the session-ended screen was shown
      - A UI test fires Done with a dirty draft and asserts a save-or-discard prompt appears, no shutdown fires until a choice is made, and choosing save persists the draft before the shutdown request
      - A test with a short idle timeout starts a `domain-edit` session, sends no requests, and asserts the process exits zero after the timeout (the walk-away guard unblocks a waiting caller)
      - A test injects a boot-step failure into a `domain-edit` invocation and asserts a non-zero exit before any browser open, matching the harness's boot failure rules
      - A test performs an edit-and-save session and asserts the caller can detect the change by comparing the file content before invocation and after exit
    page: Domain Model Editor
    region: header
    order: 10
    notes:
      - The editor-shell "Done" control ends the editing session. With a clean draft it fires the explicit-shutdown request and shows the session-ended screen.
      - With a dirty draft it first prompts save / discard / keep-editing — edits are never silently dropped and never saved without the designer's confirmation.

  - name: Conflict reload prompt
    shows: message
    actions: confirm, dismiss
    source: "@domain-model-editor-mvp/editor-ui-shell-as-the-first-embedded-ui-bundle-consumer"
    verify:
      - A build-integration test builds the bundle, boots the harness with it embedded, fetches `/` and asserts the editor shell HTML is served (the 503 `studio-ui-bundle-not-built` envelope no longer occurs)
      - A UI test edits a field, asserts the save bar shows dirty state, saves, and asserts the bar returns to clean with a last-saved timestamp
      - A UI test receives a 409 on save and asserts the reload-and-reapply prompt appears, reload refetches the model with a fresh etag, and no second save fires without designer action
      - A UI test receives a `validation-failed` envelope and asserts each `fields[]` entry renders at its form control, not only as a toast
      - A UI test simulates connection refusal after a successful session and asserts the session-ended screen appears with the restart command
      - A UI test navigates to an unknown route and asserts the shell renders (no browser-level 404), while a fetch to an unknown `/api/*` path still surfaces the harness's `not-found` envelope
    page: Domain Model Editor
    region: dialog
    order: 10
    notes:
      - Shown when a save returns the 409 conflict envelope — the file changed on disk since load. Names what happened and offers reload-and-reapply or keep-my-draft; never offers a silent overwrite.
      - Reload refetches the model with a fresh etag; no second save fires without designer action.

  - name: Error-envelope feedback
    shows: message, status
    actions: acknowledge
    source: "@domain-model-editor-mvp/editor-ui-shell-as-the-first-embedded-ui-bundle-consumer"
    verify:
      - A build-integration test builds the bundle, boots the harness with it embedded, fetches `/` and asserts the editor shell HTML is served (the 503 `studio-ui-bundle-not-built` envelope no longer occurs)
      - A UI test edits a field, asserts the save bar shows dirty state, saves, and asserts the bar returns to clean with a last-saved timestamp
      - A UI test receives a 409 on save and asserts the reload-and-reapply prompt appears, reload refetches the model with a fresh etag, and no second save fires without designer action
      - A UI test receives a `validation-failed` envelope and asserts each `fields[]` entry renders at its form control, not only as a toast
      - A UI test simulates connection refusal after a successful session and asserts the session-ended screen appears with the restart command
      - A UI test navigates to an unknown route and asserts the shell renders (no browser-level 404), while a fetch to an unknown `/api/*` path still surfaces the harness's `not-found` envelope
    page: Domain Model Editor
    region: main
    order: 30
    notes:
      - Maps the harness error envelopes to feedback — `validation-failed` field entries render inline at their form control (not only as a toast); `server-error` shows a toast carrying the request id for log correlation.

  - name: Session-ended screen
    shows: message, empty-state
    actions: acknowledge
    source: "@domain-model-editor-mvp/editor-ui-shell-as-the-first-embedded-ui-bundle-consumer, @domain-model-editor-mvp/blocking-domain-edit-invocation-for-agent-handoff"
    verify:
      - A build-integration test builds the bundle, boots the harness with it embedded, fetches `/` and asserts the editor shell HTML is served (the 503 `studio-ui-bundle-not-built` envelope no longer occurs)
      - A UI test edits a field, asserts the save bar shows dirty state, saves, and asserts the bar returns to clean with a last-saved timestamp
      - A UI test receives a 409 on save and asserts the reload-and-reapply prompt appears, reload refetches the model with a fresh etag, and no second save fires without designer action
      - A UI test receives a `validation-failed` envelope and asserts each `fields[]` entry renders at its form control, not only as a toast
      - A UI test simulates connection refusal after a successful session and asserts the session-ended screen appears with the restart command
      - A UI test navigates to an unknown route and asserts the shell renders (no browser-level 404), while a fetch to an unknown `/api/*` path still surfaces the harness's `not-found` envelope
      - A subcommand test boots `domain-edit` with injected fakes and asserts the browser-open hook receives the bound URL suffixed with `/domain-model`, while the bare invocation's hook receives the root URL
      - A test drives a `domain-edit` session, fires the Done control with a clean draft, and asserts the explicit-shutdown trigger fires, the process exits zero, and the session-ended screen was shown
      - A UI test fires Done with a dirty draft and asserts a save-or-discard prompt appears, no shutdown fires until a choice is made, and choosing save persists the draft before the shutdown request
      - A test with a short idle timeout starts a `domain-edit` session, sends no requests, and asserts the process exits zero after the timeout (the walk-away guard unblocks a waiting caller)
      - A test injects a boot-step failure into a `domain-edit` invocation and asserts a non-zero exit before any browser open, matching the harness's boot failure rules
      - A test performs an edit-and-save session and asserts the caller can detect the change by comparing the file content before invocation and after exit
    page: Domain Model Editor
    region: main
    order: 40
    notes:
      - Full-screen "Session ended — run parlay-studio to resume" state, shown after Done fires or when API calls start failing with connection errors following a period of activity. The shell does not spin on retries; it names the restart command and stops.
