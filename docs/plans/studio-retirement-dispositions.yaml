  - feature: studio-deferred/multi-screen-management
    term: built-but-undelivered
    rationale: "Placeholder baseline; nothing delivered."
  - feature: studio-foundation/figma-mcp-client
    term: built-but-undelivered
    rationale: "Fully built artifacts; no code was ever produced or kept."
  - feature: studio-foundation/figma-mcp-via-host-agent
    term: delivered-and-deleted
    rationale: "Its delivery was a retraction: the absence of direct MCP code, witnessed by eight parlay-extends markers on editor config/server files. Those witnesses are deleted with the editor, so what it delivered leaves with it. Classified per D-011/D; built-but-undelivered would falsify what the witnesses recorded."
  - feature: studio-foundation/studio-config
    term: delivered-and-deleted
    rationale: "Delivered internal/editor/config, deleted with the editor server."
  - feature: studio-foundation/studio-deployer
    term: authority-re-homed-to
    target: parlay-tool/atomic-file-writes
    rationale: "Its surviving delivery, core/internal/atomicfile, is used core-wide and carries the founding feature's markers as of the Phase 1 rewrite."
  - feature: studio-foundation/web-server-harness
    term: delivered-and-deleted
    rationale: "Delivered internal/editor/server, deleted with the editor."
