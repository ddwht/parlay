# Operator disposition record for `parlay retire-root studio`.
# Authored from the Phase 0.1 inventory (docs/plans/studio-teardown-inventory.md §3),
# decisions D-011/D-014 in the overnight log, and the backend-only ruling of
# 2026-08-30. One entry per feature in the retiring root; closed vocabulary.
dispositions:
  - feature: design-loop/design-loop
    term: delivered-and-deleted
    rationale: "Its one surviving delivery was the Design-Loop block in layout.schema.md, removed under the user-authorized 2026-08-31 disposition with a paired amendment on studio-support/page-layout-field."
  - feature: design-loop/design-loop-fallback
    term: built-but-undelivered
    rationale: "Baseline hashes two intents; no buildfile, no code ever produced."
  - feature: design-loop/vocabulary-validation
    term: built-but-undelivered
    rationale: "Fully built artifacts, but nothing was delivered: its only code trace was a stray marker on an unrelated command registration (root.go), corrected in the teardown; layout.schema.md itself records the validator is gone."
  - feature: domain-model-editor/domain-model-editor-mvp
    term: delivered-and-deleted
    rationale: "Delivered the editor persistence core inside internal/editor; the editor is deleted and the surviving domain core was re-homed by the Phase 1 marker rewrite before this retirement."
  - feature: domain-model-editor/domain-model-editor-relationships
    term: delivered-and-deleted
    rationale: "Delivered the relationships UI inside internal/editor/ui, deleted with the editor."
  - feature: domain-model-editor/domain-model-editor-validation
    term: authority-re-homed-to
    target: parlay-tool/domain-document-api
    rationale: "Its surviving deliveries (the validator seam in domain_validator.go and the one-engine parity test) carry the founding feature's markers as of the Phase 1 rewrite."
