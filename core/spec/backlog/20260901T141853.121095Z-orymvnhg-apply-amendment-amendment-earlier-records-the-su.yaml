title: apply-amendment --amendment <earlier> records the superseding amendment's promise text
body: 'With two unapplied amendments where 002 supersedes 001, `apply-amendment --amendment 001 --confirm <digest>` displays and records the promise text from 002, not 001. Amendment 001 declares the verify line ''A feature with artifacts, a buildfile and testcases reports done...''; the recorded after-promise instead contains 002''s ''A feature with both founding documents present...'' and 002''s BOTH-founding-documents constraint. The apply succeeds, then check-amendments immediately refuses with amendment-transition-receipt-invalid: ''its receipt records a different promise ... the text the human approved is not the text on record''. The dry-run shows the same wrong text, so the human approves 002''s delta believing it is 001''s, and the digest binds to it. Net effect: the ledger is left with an unresolved integrity error that blocks every later amendment on the feature, and the only recovery found was reverting .baseline.yaml. Reproduced on this repo 2026-09-01; the pre-revert corrupt baseline is preserved for inspection. Not caused by an unrelated surface.yaml splice - reverting that splice leaves the error unchanged.'
about:
