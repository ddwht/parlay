      reason: 'Fixed in this session, so the condition that produced it is gone. apply_amendment_evolve.go now derives AFTER through resolveIntentsThrough(cfg, slug, record.Seq), which truncates the record list to Seq <= selected before asking ProspectiveAuthority, instead of resolving the newest claim across the whole unapplied tail. Regression: TestSelector_SelectedRecordDoesNotBorrowASupersedingRecordsPromise, a two-record 001<-002 supersession asserting the selected record''s own text is displayed and receipted, post-apply validation is clean, and 002 then shows its own delta from the applied-001 state; the control restoring the old call fails on both the display and receipt assertions. Verified end to end: 001 applied cleanly with digest 02ee0566 and check-amendments reported ready with zero issues immediately afterwards. NOT declined - declining would record that we chose to leave the defect in the tool, which is the opposite of what happened.'
