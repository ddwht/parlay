    - actions: select-one, dismiss
      name: Skill-Side Root Disambiguation Prompt
      notes:
        - The skill-side counterpart to the CLI Root Disambiguation Prompt and the CLI Ambiguous-Reference Disambiguation Prompt.
        - Rendered through the agent's native question mechanism (e.g. AskUserQuestion on Claude Code) — NOT through stdin/stdout.
        - Triggered when the wrapped CLI invocation returns an ambiguous-reference or ambiguous-active-root structured signal; the skill catches the signal, re-prompts via the agent's mechanism, and re-invokes the CLI with the user's choice.
        - '`dismiss` cancels the skill cleanly without leaving partial state.'
        - Identical UX across deployed adapters — the skill source is one file, deployed by every adapter's deployer.
      order: 1
      page: parlay-skill
      region: main
      shows: message, data-list
      source: '@parlay-tool/multi-root/skill-invocation-in-a-multi-root-project'
      verify:
        - '`parlay sync @feat` invoked while agent cwd is `apps/web/` operates on the `web` child root, with no special prompting'
        - '`/parlay-build-feature @intent/A` invoked while agent cwd is the parent and the feature exists in two child roots — the skill surfaces an `AskUserQuestion` (or adapter equivalent) with the candidate roots, then re-invokes the CLI against the user''s choice'
        - '`parlay sync web:@feat` works regardless of agent cwd'
        - '`/parlay-create-domain-model --root web` works as a skill argument the same way it works as a CLI flag'
        - A skill invoked while the user is in a feature-empty parent project (no parent-owned features in `spec/intents/`) does not show "no features found" — it shows the registered children and prompts for the target root if needed
        - 'When a skill auto-resolves to a non-cwd root (e.g. single child match for a bare reference), the visible response begins with "operating on root: <name>"'
        - Skill prompt text in `internal/embedded/skills/*.skill.md` contains no hardcoded `.parlay/` paths — every path reference is via the active-root resolver
        - The same skill behavior is exercised on Claude Code, Cursor, and Generic CLI — no adapter-specific skill source
    - actions: ""
      name: Skill-Side Operating-Root Announcement
      notes:
        - Visible response prefix written by the skill whenever the resolved root differs from the cwd-default — prefix on a feature reference, `--root` flag, single-match auto-resolution, or disambiguation choice.
        - 'One line, before any other skill output: `operating on root: <name> (<source>)` where source is one of `prefix`, `--root flag`, `auto-resolved (only match)`, `disambiguated`.'
        - Mirrors the CLI Cross-Root Targeting Announcement; both must agree on naming so users see the same message regardless of invocation path.
