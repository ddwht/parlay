feature: studio-support/layout-aware-build
fragments:
    - actions: select-one, dismiss, acknowledge
      name: Disambiguation Prompt
      notes:
        - The prompt is rendered to the terminal during an interactive `parlay build-feature` run when Pass 2 returns multiple candidates whose AI-assigned confidence values are within the configurable threshold.
        - 'The displayed payload always includes: page path (e.g., `pages/tasks.md`), layout-node path within that page (e.g., `region/toolbar/button[2]`), the human label of the node (e.g., "Process"), and the candidate list with stable numeric selectors `[1]`, `[2]`, ... — each candidate names a domain element (`@feature/operation` or `@feature/entity[.field]`) and its AI confidence value.'
        - 'Action mapping: numeric digits select a candidate (`select-one`); `[q]` aborts the build with non-zero exit (`dismiss`); `[s]` records the binding as `unresolved` and continues the build (`acknowledge` — designer signals "I have seen this, defer the decision").'
        - The prompt is the **only** path that introduces designer judgment into a binding decision. Codegen never prompts; rule and AI passes never prompt; only this surface element collects designer input.
        - Multiple ambiguities in one build run produce a sequence of prompts (one fragment instance per ambiguity), shown in deterministic `(page-path, node-path)` lexicographic order — not as a batched multi-select.
        - Headless / non-interactive runs render no prompt; the build emits an `ambiguous-binding` error to stderr instead. That error is CLI diagnostic output, not a surface fragment.
        - The candidate list at the moment of selection is recorded with the resulting binding (see infrastructure fragment "Interactive Disambiguation Choice Recording") so future runs can detect when the candidate list has changed and re-surface the prompt.
      order: 1
      page: build-feature CLI
      region: main
      shows: data-list, message
      source: '@studio-support/layout-aware-build/raise-an-interactive-disambiguation-prompt-when-both-passes-leave-ambiguity'
      verify:
        - 'A page with one ambiguous binding triggers exactly one prompt; selecting `[1]` records the first candidate with `confidence: designer` and continues the build'
        - Re-running build immediately after a prompt selection completes without re-prompting; the recorded choice is read from the buildfile
        - Editing the layout to add a node that has its own ambiguity produces a fresh prompt for the new node only — the previously recorded choice is preserved
        - Renaming the chosen domain operation (e.g., `processTask` → `processTaskItem`) invalidates the recorded choice and re-triggers the prompt with the updated candidate list
        - Pressing `[q]` during a prompt aborts the build with a non-zero exit code and writes no partial buildfile
        - A build with three ambiguous bindings on three different pages produces three prompts in `(page-path, node-path)` lexicographic order
