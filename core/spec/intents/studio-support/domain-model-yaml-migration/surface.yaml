feature: studio-support/domain-model-yaml-migration
fragments:
    - actions: invoke
      name: migrate-domain-model command surface
      notes:
        - The `parlay migrate-domain-model` command is the user-visible surface for Flow A — the one-shot, project-lifetime port from `domain-model.md` to `domain-model.yaml`.
        - Default invocation (no flags) detects an existing `domain-model.md` at the active root, parses it via the AI path that wrote it, writes `domain-model.yaml` beside it, and prints a success line plus the absolute path of the written YAML on stdout. The original `.md` is preserved with a deprecation header prepended (the only Core-authored change to the `.md`).
        - 'Greenfield case (no `domain-model.md` present): the command prints `nothing to migrate` on stdout and exits zero. This is a no-op, not an error — safe to run as part of an unconditional upgrade script.'
        - 'Already-migrated case (a `domain-model.yaml` already exists): exits non-zero with an `already migrated` message that names the existing YAML''s absolute path. The YAML is not re-read or re-written. The `.md` is not re-parsed.'
        - 'Ambiguous-markdown case (the source `.md` lacks declared types, has unclear cardinalities, or omits enum tones): the command writes the YAML with explicit annotation markers on each unresolved field (e.g., `type: <unresolved: original prose said "the date">`) and exits non-zero. The designer must resolve every annotation before downstream commands accept the model.'
        - 'Stdout/stderr discipline: success and diff output go to stdout; errors and the ambiguity-envelope (multi-root) go to stderr. The command never mixes streams.'
      order: 10
      page: parlay-migrate-domain-model (CLI)
      region: main
      shows: message, status, code
      source: '@studio-support/domain-model-yaml-migration/migrate-existing-domain-model-md-projects-to-yaml'
    - actions: invoke
      name: migrate-domain-model dry-run preview
      notes:
        - '`--dry-run` previews the conversion without writing anything. The command prints the full planned `domain-model.yaml` content on stdout, followed by a unified diff against any existing artifact (if a YAML is already present, against that YAML; if only the `.md` is present, against an empty file).'
        - 'Exit code mirrors what a real run would do: zero on a clean migration that would write successfully, non-zero on ambiguity that would emit annotation markers, non-zero on the already-migrated case. This makes `--dry-run` viable as a CI check.'
        - The dry-run never touches the filesystem — no temp files, no partial writes. The original `.md` is read but its on-disk bytes are not modified. No deprecation header is prepended in dry-run mode.
      order: 20
      page: parlay-migrate-domain-model (CLI)
      region: main
      shows: code, diff, message
      source: '@studio-support/domain-model-yaml-migration/migrate-existing-domain-model-md-projects-to-yaml'
    - actions: invoke-destructive
      name: migrate-domain-model --force overwrite warning
      notes:
        - '`--force` instructs the command to overwrite an existing `domain-model.yaml` after re-parsing the `.md`. It is the explicit escape hatch when the YAML was hand-edited or corrupted and the designer wants to restart from the markdown.'
        - 'Before overwriting, the command prints a single warning line on stderr: `--force will overwrite existing domain-model.yaml; any hand edits to the YAML will be discarded`. The warning is unconditional under `--force` — there is no interactive y/n prompt because parlay commands are non-interactive at the CLI level.'
        - The designer is expected to have the YAML under version control. The command does not back up the existing YAML before overwriting. The deprecation header on the `.md` is left in place (already pointing at the YAML); no second header is prepended.
      order: 30
      page: parlay-migrate-domain-model (CLI)
      region: main
      shows: message, status
      source: '@studio-support/domain-model-yaml-migration/migrate-existing-domain-model-md-projects-to-yaml'
    - actions: invoke
      name: migrate-domain-model multi-root targeting
      notes:
        - '`--root <name>` scopes the migration to one registered child root in a multi-root project. Other children''s `domain-model.md` files are untouched.'
        - Without `--root` in an ambiguous multi-root context, the CLI exits with code 11 and the standard ambiguity JSON envelope on stderr (per active-root convention). Stdout stays empty. No partial migration is performed.
        - The standard `--ambiguity-as-signal` flag is supported on this command for skill-wrapper consumers.
      order: 40
      page: parlay-migrate-domain-model (CLI)
      region: main
      shows: message, status
      source: '@studio-support/domain-model-yaml-migration/migrate-existing-domain-model-md-projects-to-yaml'
    - actions: (none)
      name: domain-model.yaml validation error reporting
      notes:
        - This fragment captures the shared error-reporting surface emitted whenever any parlay command (extract, load, build-feature, generate-code, …) reads `domain-model.yaml` and validation fails. The validator is one code path; the surface is shared across every caller.
        - 'Schema-version-mismatch error (file version older than binary): a single line on stderr naming the file''s `schema_version`, the binary''s expected version, and the migration path (`run parlay upgrade-domain-model` once that command lands; until then, the message points at this feature''s docs). Exit non-zero. No partial parse — the model is not loaded.'
        - 'Schema-version-newer-than-binary error: stderr line stating that the file''s `schema_version` is newer than the running Core understands, and instructing the designer to upgrade Core (`parlay upgrade`). Refuses to load. No forward-migration guess.'
        - 'Deep-validation failure (relationship endpoint references undeclared entity, operation input names a field that does not exist, enum field references undeclared value): one stderr line per unresolved reference, naming the YAML path (`entities.Order.fields.status references undeclared enum OrderStatus`) and the offending value. The model is not partially accepted — every reference must resolve or the command exits non-zero.'
        - 'Hand-edit re-validation: when the designer opens the YAML in a text editor and saves invalid content, the next read by any parlay command surfaces these same error shapes. There is no separate "validate" command surface in this feature — validation is intrinsic to every read path.'
      order: 10
      page: domain-model-validation (cross-command surface)
      region: main
      shows: message, status, code
      source: '@studio-support/domain-model-yaml-migration/define-a-versioned-yaml-schema-for-the-domain-model'
    - actions: invoke
      name: extract-domain-model output surface (post-migration)
      notes:
        - After this migration, `parlay create-domain-model` emits `domain-model.yaml` at the active root (project level, not per-feature). The existing per-feature `.md` files (if any) are not touched, not re-emitted, and not consulted.
        - The command prints the absolute path of the written YAML on stdout, plus a one-line summary (`extracted N entities, M enums, K relationships, J operations`). No human-readable preamble before that line.
        - If the YAML write fails (permissions, disk full), the command exits non-zero without writing a fallback `.md` — the markdown form is gone from the post-migration world.
        - Existing callers that previously parsed `create-domain-model` stdout for the markdown body will break by design; this is a surfaced behavior change, not a silent one. The migration intent commits to that breakage as part of the format swap.
      order: 10
      page: parlay-create-domain-model (CLI)
      region: main
      shows: message, status, code
      source: '@studio-support/domain-model-yaml-migration/update-extract-domain-model-and-load-domain-model-to-round-trip-yaml'
    - actions: select-one, provide-text
      name: load-domain-model conflict disambiguation prompt
      notes:
        - 'When `parlay load-domain-model <path-or-url>` finds a conflict — an incoming entity shares a name with an existing one but differs in fields — the merge pauses and the agent presents a side-by-side: incoming fields on one side, local fields on the other.'
        - 'The designer sees four options: keep local, take incoming, merge field-by-field, or rename one of them. Same prompt shape as the markdown-era flow; just sourced from YAML on both sides.'
        - The merge does not silently union fields. Every conflict requires an explicit choice. Field-by-field merge walks each differing field individually with the same option set scoped to that field.
        - Non-conflict entities (incoming entity not present locally, or present and structurally identical) merge without prompting.
      order: 10
      page: parlay-load-domain-model (CLI)
      region: main
      shows: diff, data-table, message
      source: '@studio-support/domain-model-yaml-migration/update-extract-domain-model-and-load-domain-model-to-round-trip-yaml'
    - actions: invoke
      name: load-domain-model schema-version migration notice
      notes:
        - When the loaded YAML's `schema_version` is older than the running Core supports, the command prints a single line on stderr naming the source version and the chain of migrations being applied (`migrating loaded model from v1 to v2`). The on-disk source file is NOT modified — only the in-memory model used for the merge is migrated.
        - When the loaded YAML's `schema_version` is newer than the running Core understands, or so old that no migrator chain reaches the current version, the command exits non-zero with an actionable error pointing at the migration path (upgrade Core, or upgrade the source project, depending on direction). No silent drop of unknown fields.
        - 'Markdown loads (`parlay load-domain-model some-other-project/domain-model.md`) are refused with an actionable error: `load accepts YAML only; run parlay migrate-domain-model in the source project first`. Markdown is out of scope for cross-project sharing in the post-migration world.'
      order: 20
      page: parlay-load-domain-model (CLI)
      region: main
      shows: message, progress
      source: '@studio-support/domain-model-yaml-migration/update-extract-domain-model-and-load-domain-model-to-round-trip-yaml'
    - actions: (none)
      name: domain-model.md deprecation header
      notes:
        - 'After a successful `parlay migrate-domain-model` run, the original `domain-model.md` carries a deprecation header at the top — the only Core-authored change to the file. The header is plain markdown (not a code fence) and includes: a one-line "deprecated, see domain-model.yaml" notice, the relative path to the YAML (`./domain-model.yaml`), and a one-sentence note that edits to the markdown have no effect post-migration.'
        - 'The header is idempotent: a second migration run (with `--force`) does not stack a second header on top of the first. The existing header is detected and left in place.'
        - The designer may delete the `.md` manually at any time; Core never deletes it. Once deleted, the YAML is the only source.
      order: 10
      page: domain-model.md (in-file surface)
      region: main
      shows: message
      source: '@studio-support/domain-model-yaml-migration/migrate-existing-domain-model-md-projects-to-yaml'
    - actions: (none)
      name: Open questions surfaced from dialogs
      notes:
        - This fragment is a designer-facing record of unresolved questions from `dialogs.md`. It does NOT correspond to runtime user-facing output. It exists so build-feature and downstream review can see the open decisions in one place.
        - 'Q1 — enum tone vocabulary: closed set `{neutral, info, warning, danger, success}` vs open string. The choice changes (a) whether the schema rejects unknown tones with the closed-set list as the error message, or (b) accepts any string and defers rendering fallback to consumers. Surface impact: the validation-error fragment above will name the closed list when (a), or stay silent on tone values when (b). Cross-feature coupling: `adapter-vocabulary-extension` already lists `neutral | info | warning | danger | success` for color-token tones — answering (a) with the same vocabulary is the path of least resistance.'
        - 'Q2 — entity shape: flat fields only (primitive + enum + ref) vs nested struct-shaped fields. Surface impact: the validation-error fragment will emit different error shapes — flat-only rejects nested literals naming the parent entity; nesting-allowed validates recursively and produces nested-path error references (`entities.Order.fields.shipping_address.city`).'
        - 'Q3 — `migrate-domain-model` command ownership: Core CLI vs Studio installer. Surface impact: if Core ships it, the surface fragments above are owned by Core and the command appears in `parlay --help` from the day Core upgrades. If Studio packages it, those fragments move to a Studio-owned surface and Core''s `--help` does not list `migrate-domain-model`. The CLI command name (`parlay migrate-domain-model`) and flag set are stable across either choice; only the delivery vector changes.'
        - These questions are tracked in `intents.md` Questions sections. The dialogs branches that surfaced them are explicitly preserved as deferred-decision branches, not collapsed.
      order: 99
      page: (design-time only — not a runtime surface)
      region: notes
      shows: message
      source: '@studio-support/domain-model-yaml-migration/define-a-versioned-yaml-schema-for-the-domain-model, @studio-support/domain-model-yaml-migration/migrate-existing-domain-model-md-projects-to-yaml'
