feature: studio-support/studio-cli-hooks
fragments:
    - actions: ""
      name: parlay status reports Studio detection
      notes:
        - When `parlay-studio` is detected (on `PATH` or via `PARLAY_STUDIO` env override), `parlay status` adds a "Studio detected" line to its standard output, alongside the resolved binary path and version.
        - When `parlay-studio` is not detected — absent from `PATH`, suppressed by `PARLAY_STUDIO=` (empty), or present but non-executable — `parlay status` produces no Studio-related line. The absence is silent; designers running on a Studio-free machine see no behavior change.
        - 'The non-executable case is the one exception that surfaces a one-line diagnostic when the designer asks (e.g., `parlay status --verbose`): "studio: not detected (found at /path but not executable)" — but the default `parlay status` output stays silent.'
        - Order 50 places the Studio line after the existing `parlay status` content (root, registered children, feature counts) and before any closing summary; exact ordering is at the adapter's discretion within the `main` region.
      order: 50
      page: parlay-status (CLI)
      region: main
      shows: status, message
      source: '@studio-support/studio-cli-hooks/detect-parlay-studio-at-runtime'
      verify:
        - On a machine with `parlay-studio` on `PATH`, `parlay status` reports Studio as detected
        - On a machine without `parlay-studio` on `PATH`, no Studio-related output appears anywhere in normal commands
        - Setting `PARLAY_STUDIO=` (empty) suppresses detection even when the binary is on `PATH`
        - A non-executable `parlay-studio` on `PATH` is treated as "not detected" rather than producing a permission error during normal commands
    - actions: ""
      name: Version-mismatch warning at first detection
      notes:
        - 'When `parlay-studio` is detected but its version falls outside the range Core expects, a single warning line is emitted on stderr at the first detection in the process: `warning: parlay-studio version X.Y is older than expected (need >=A.B); some hooks may not work.`'
        - The warning is suppressed for the rest of the process. A designer running stale Studio sees one message per command invocation, not one per hook point.
        - The warning is designer-facing diagnostic; it does not gate any hook from firing — version-mismatched Studio is still considered "detected" for prompt purposes.
        - Wording should be terse and one-line. The warning is a hint that something may break, not a blocker.
      order: 10
      page: any-parlay-command (CLI)
      region: header
      shows: message
      source: '@studio-support/studio-cli-hooks/detect-parlay-studio-at-runtime'
      verify:
        - On a machine with `parlay-studio` on `PATH`, `parlay status` reports Studio as detected
        - On a machine without `parlay-studio` on `PATH`, no Studio-related output appears anywhere in normal commands
        - Setting `PARLAY_STUDIO=` (empty) suppresses detection even when the binary is on `PATH`
        - A non-executable `parlay-studio` on `PATH` is treated as "not detected" rather than producing a permission error during normal commands
    - actions: confirm, dismiss, hand-off
      name: Studio prompt after parlay create-domain-model
      notes:
        - Fires after `parlay create-domain-model` completes its main work, when Studio is detected, the session is interactive (TTY), and `--no-studio` is not set.
        - '**Brownfield wording** (the command produced or updated a model from extractable signals): `Open Studio''s Domain Model Editor against this model? (y/N) `.'
        - '**Greenfield wording** (the command wrote an empty stub because no signals were found): `Empty domain model created — ready to author. Open Studio''s Domain Model Editor? (y/N) `. The wording shift signals that the stub is unusable until something fills it in.'
        - On `y` (or any case-insensitive yes), Core invokes `parlay-studio domain-edit` against the same active root and waits for it to exit. On `n`, on Enter (default no), or on EOF, Core proceeds normally — the empty stub stays on disk in the greenfield case.
        - The prompt is one line. It does not collect rationale, file selection, or any other input — designers stay in the terminal flow they were in.
      order: 10
      page: parlay-create-domain-model (CLI)
      region: footer
      shows: message
      source: '@studio-support/studio-cli-hooks/prompt-to-open-studio-at-workflow-hand-off-points'
      verify:
        - Running `parlay create-domain-model` in **brownfield** mode (extractable signals or existing model) on a project with Studio detected ends with a one-line prompt offering the Domain Model Editor against the produced model; declining proceeds normally
        - Running `parlay create-domain-model` in **greenfield** mode (no model, no extractable signals) on a project with Studio detected creates an empty stub and ends with a one-line "ready to author — open Studio?" prompt; declining leaves the empty stub on disk and proceeds normally
        - Running `parlay create-artifacts` on a project with Studio detected ends with a one-line prompt offering Studio's artifact editor; declining proceeds normally
        - Running `parlay sync` on a project with Studio detected ends with a one-line prompt offering Studio (e.g., to reconcile drift visually); declining proceeds normally
        - Running `parlay add-feature` or `parlay lock-page` on a project with Studio detected does NOT prompt — these commands are deliberately excluded from the starter hook set
        - The same trio commands on a project without Studio detected do not show any prompt
        - Confirming any trio prompt invokes the corresponding `parlay-studio` subcommand against the same active root, with Core waiting for it to exit
        - Passing `--no-studio` to any trio command skips the prompt regardless of detection
        - Running any trio command in a non-TTY context (piped output, CI) skips the prompt regardless of detection
        - Within a single Core process, declining the first hook does not suppress subsequent hooks — each hook fires independently and asks again
        - An integration test exercises the actual `parlay-studio` subprocess invocation end-to-end when the binary is on `PATH` (verifying exit-code propagation, the failure-line wording, and the wait-and-resume contract). When the binary is absent — the world we are in until Studio ships — the test skips with a clear "parlay-studio not on PATH" message rather than passing trivially. The skipped count surfaces the still-pending Studio dependency in test output and flips to passing automatically once Studio is installed
        - 'A contract test asserts that the installed `parlay-studio` binary honors each of the three Studio subcommand names that Core hard-codes (`domain-edit` for the create-domain-model hook, `artifacts-review` for the create-artifacts hook, `reconcile` for the sync hook), e.g., by invoking each with `--help` and checking for a non-error exit. The test is **fail-hard red, NOT skipped**, when `parlay-studio` is absent from `PATH` — the absence is itself a contract violation while Studio is still pending. The test is also red when the binary is present but any subcommand is unhonored. The test goes green only when `parlay-studio` is on `PATH` and all three subcommands respond non-error to `--help`. This louder signal is intentional: the subcommand-name table inside Core is the single source of truth today, and a yellow/skipped test would let the contract drift unobserved. Distinguishing this from the skip-until-binary integration test above is deliberate — that test cannot meaningfully run without the binary, so skip is correct; this contract test asserts a fact about the binary''s existence, so absence is a fail'
    - actions: confirm, dismiss, hand-off
      name: Studio prompt after parlay create-artifacts
      notes:
        - Fires after `parlay create-artifacts` completes its main work (producing `surface.md` and/or `infrastructure.md` for the feature), when Studio is detected, the session is interactive, and `--no-studio` is not set.
        - 'Wording: `Open Studio to review the produced artifacts? (y/N) `.'
        - On `y`, Core invokes the matching `parlay-studio` artifact-review subcommand for the same feature against the same active root and waits. On `n` or default, Core returns normally with the standard creation summary as the final output.
      order: 10
      page: parlay-create-artifacts (CLI)
