# The `deployers:` block that used to sit here now lives at
# core/spec/intents/parlay-tool/agent-integration/infrastructure.md.
#
# Blueprint's owned scope is closed to app, shells, navigation, authorization,
# data, errors, state and platform; `deployers:` was outside it under that list
# and under the one that preceded it. It validated only because the scope check
# runs on the multi-target project pass and core/ has no adapter-set.yaml, so it
# was never reached — `parlay validate --type blueprint` on this file now
# rejects an out-of-scope key, which is how the block was found.
#
# It described a boundary and the cross-cutting rules for changing it, which is
# what infrastructure.md is for.
