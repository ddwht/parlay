feature: studio-support/studio-cli-hooks
adapter: go-cli

fixtures:
  studio-on-path:
    description: Studio binary is on PATH and executable
    data:
      StudioDetection:
        - detected: true
          binary-path: /usr/local/bin/parlay-studio
          version: "1.4.0"
          reason: detected

  studio-absent:
    description: Studio is not on PATH and PARLAY_STUDIO is unset
    data:
      StudioDetection:
        - detected: false
          binary-path: ""
          version: ""
          reason: absent-from-path

  studio-env-override:
    description: PARLAY_STUDIO points at a custom Studio path
    data:
      StudioDetection:
        - detected: true
          binary-path: /opt/parlay-studio-dev/parlay-studio
          version: "1.5.0-dev"
          reason: detected

  studio-env-empty-suppression:
    description: PARLAY_STUDIO set to empty string forces not-detected
    data:
      StudioDetection:
        - detected: false
          binary-path: ""
          version: ""
          reason: suppressed-by-env

  studio-not-executable:
    description: A file named parlay-studio is on PATH but lacks the executable bit
    data:
      StudioDetection:
        - detected: false
          binary-path: /usr/local/bin/parlay-studio
          version: ""
          reason: not-executable

  studio-version-mismatch:
    description: Studio is detected but its version is outside the expected range
    data:
      StudioDetection:
        - detected: true
          binary-path: /usr/local/bin/parlay-studio
          version: "0.9.0"
          reason: detected
      StudioVersionCompat:
        - mismatch: true
          detected-version: "0.9.0"
          expected-range: ">=1.0.0"
          warning-emitted: false

  trio-interactive-detected:
    description: Interactive TTY session, Studio detected, --no-studio not set
    data:
      StudioDetection:
        - detected: true
          binary-path: /usr/local/bin/parlay-studio
          version: "1.4.0"
          reason: detected
      HookGate:
        - tty-interactive: true
          studio-detected: true
          no-studio-flag: false

  trio-non-interactive:
    description: Output piped or running under CI; the TTY gate suppresses the prompt
    data:
      HookGate:
        - tty-interactive: false
          studio-detected: true
          no-studio-flag: false

  trio-no-studio-flag:
    description: Designer passed --no-studio (or set parlay.no_studio = true)
    data:
      HookGate:
        - tty-interactive: true
          studio-detected: true
          no-studio-flag: true

  trio-studio-absent:
    description: Trio command runs but Studio is not detected; no prompt fires
    data:
      HookGate:
        - tty-interactive: true
          studio-detected: false
          no-studio-flag: false

  domain-model-brownfield-prompt:
    description: create-domain-model produced a populated model from extractable signals
    data:
      HookPrompt:
        - trio-command: create-domain-model
          mode: brownfield
          wording: "Open Studio's Domain Model Editor against this model? (y/N) "
          studio-subcommand: domain-edit

  domain-model-greenfield-prompt:
    description: create-domain-model wrote an empty stub because no signals were found
    data:
      HookPrompt:
        - trio-command: create-domain-model
          mode: greenfield
          wording: "Empty domain model created — ready to author. Open Studio's Domain Model Editor? (y/N) "
          studio-subcommand: domain-edit

  artifacts-review-prompt:
    description: create-artifacts completed; offering Studio for review
    data:
      HookPrompt:
        - trio-command: create-artifacts
          mode: default
          wording: "Open Studio to review the produced artifacts? (y/N) "
          studio-subcommand: artifacts-review

  sync-reconcile-prompt:
    description: sync completed; offering Studio for visual reconciliation
    data:
      HookPrompt:
        - trio-command: sync
          mode: default
          wording: "Open Studio to reconcile this drift visually? (y/N) "
          studio-subcommand: reconcile

  studio-launch-failure:
    description: Designer accepted the prompt but Studio crashed or exited non-zero
    data:
      StudioInvocation:
        - subcommand: domain-edit
          exit-code: 1
          active-root: /workspace/example-project
          feature-context: ""

routes:
  - path: parlay-status
    page: parlay-status (CLI)
    flow-pattern: cobra-subcommands
    regions:
      main:
        components: [studio-status-line]
      header:
        components: [version-mismatch-warning]

  - path: parlay-create-domain-model
    page: parlay-create-domain-model (CLI)
    flow-pattern: display-then-confirm
    regions:
      footer:
        components: [studio-prompt-domain-model, studio-launch-failure-line]
      toolbar:
        components: [no-studio-flag-domain-model]

  - path: parlay-create-artifacts
    page: parlay-create-artifacts (CLI)
    flow-pattern: display-then-confirm
    regions:
      footer:
        components: [studio-prompt-artifacts, studio-launch-failure-line]
      toolbar:
        components: [no-studio-flag-artifacts]

  - path: parlay-sync
    page: parlay-sync (CLI)
    flow-pattern: display-then-confirm
    regions:
      footer:
        components: [studio-prompt-sync, studio-launch-failure-line]
      toolbar:
        components: [no-studio-flag-sync]

components:
  studio-status-line:
    source: "@studio-support/studio-cli-hooks/parlay-status-reports-studio-detection"
    widget: prefixed-message
    description: |
      Adds a "Studio detected" line to parlay status output when StudioDetection.detected is true.
      Reports binary path and version. Stays silent when detected is false (default behavior).
      Surfaces the not-executable diagnostic only under --verbose.

    data:
      inputs:
        - name: detection
          model: StudioDetection
          field: ""
          from: computed

    elements:
      - name: studio-detected-line
        widget: prefixed-message
        bind: detection
        format: "Studio detected: {binary-path} (version {version})"
        visible-when: "detection.detected == true"
      - name: not-executable-diagnostic
        widget: fmt.Println
        bind: detection
        format: "studio: not detected (found at {binary-path} but not executable)"
        visible-when: "detection.reason == not-executable AND verbose-flag == true"

    actions: []

    operations:
      - type: read-file
        path: cached:resolution-context.studio-detection
        bind: detection

  version-mismatch-warning:
    source: "@studio-support/studio-cli-hooks/version-mismatch-warning-at-first-detection"
    widget: fmt.Println
    description: |
      One-line warning emitted on stderr at the first successful Studio detection in the process
      when the detected version falls outside Core's expected range. Suppressed for the rest of
      the process via the warning-emitted flag.

    data:
      inputs:
        - name: compat
          model: StudioVersionCompat
          field: ""
          from: computed

    elements:
      - name: version-warning-line
        widget: fmt.Println
        bind: compat
        format: "warning: parlay-studio version {detected-version} is older than expected (need {expected-range}); some hooks may not work."
        visible-when: "compat.mismatch == true AND compat.warning-emitted == false"

    actions: []

    operations:
      - type: read-file
        path: cached:resolution-context.studio-version-compat
        bind: compat

  studio-prompt-domain-model:
    source: "@studio-support/studio-cli-hooks/studio-prompt-after-parlay-create-domain-model"
    widget: yn-prompt
    description: |
      One-line "Open Studio?" prompt emitted by parlay create-domain-model after its main work.
      Wording differs between brownfield (model produced from signals) and greenfield (empty
      stub written) modes. Each invocation re-runs the gates fresh — no per-session memory.
      On confirmation, invokes parlay-studio domain-edit synchronously and waits for it to exit.

    data:
      inputs:
        - name: prompt
          model: HookPrompt
          field: ""
          from: computed
        - name: gate
          model: HookGate
          field: ""
          from: computed

    elements:
      - name: prompt-line
        widget: fmt.Printf
        bind: prompt
        format: "{wording}"
        visible-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"

    actions:
      - name: confirm-open-studio
        widget: yn-prompt
        enabled-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"
        effect: call:invoke-studio-subprocess
        target: invoke-studio-subprocess
      - name: dismiss-prompt
        widget: yn-prompt
        enabled-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"
        effect: navigate:return-to-shell
        target: return-to-shell
      - name: hand-off-to-studio
        widget: cobra-command
        enabled-when: "prompt.studio-subcommand == domain-edit"
        effect: call:parlay-studio-domain-edit
        target: parlay-studio-domain-edit

    operations:
      - type: read-file
        path: cached:resolution-context.studio-detection
        bind: detection

  studio-prompt-artifacts:
    source: "@studio-support/studio-cli-hooks/studio-prompt-after-parlay-create-artifacts"
    widget: yn-prompt
    description: |
      One-line "Open Studio?" prompt emitted by parlay create-artifacts after producing
      surface.md and/or infrastructure.md. On confirmation, invokes the matching
      parlay-studio artifact-review subcommand against the same active root and feature.

    data:
      inputs:
        - name: prompt
          model: HookPrompt
          field: ""
          from: computed
        - name: gate
          model: HookGate
          field: ""
          from: computed

    elements:
      - name: prompt-line
        widget: fmt.Printf
        bind: prompt
        format: "{wording}"
        visible-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"

    actions:
      - name: confirm-open-studio
        widget: yn-prompt
        enabled-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"
        effect: call:invoke-studio-subprocess
        target: invoke-studio-subprocess
      - name: dismiss-prompt
        widget: yn-prompt
        enabled-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"
        effect: navigate:return-to-shell
        target: return-to-shell
      - name: hand-off-to-studio
        widget: cobra-command
        enabled-when: "prompt.studio-subcommand == artifacts-review"
        effect: call:parlay-studio-artifacts-review
        target: parlay-studio-artifacts-review

    operations:
      - type: read-file
        path: cached:resolution-context.studio-detection
        bind: detection

  studio-prompt-sync:
    source: "@studio-support/studio-cli-hooks/studio-prompt-after-parlay-sync"
    widget: yn-prompt
    description: |
      One-line "Open Studio?" prompt emitted by parlay sync after coverage and drift analysis.
      On confirmation, invokes parlay-studio reconcile against the same active root and feature.

    data:
      inputs:
        - name: prompt
          model: HookPrompt
          field: ""
          from: computed
        - name: gate
          model: HookGate
          field: ""
          from: computed

    elements:
      - name: prompt-line
        widget: fmt.Printf
        bind: prompt
        format: "{wording}"
        visible-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"

    actions:
      - name: confirm-open-studio
        widget: yn-prompt
        enabled-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"
        effect: call:invoke-studio-subprocess
        target: invoke-studio-subprocess
      - name: dismiss-prompt
        widget: yn-prompt
        enabled-when: "gate.tty-interactive == true AND gate.studio-detected == true AND gate.no-studio-flag == false"
        effect: navigate:return-to-shell
        target: return-to-shell
      - name: hand-off-to-studio
        widget: cobra-command
        enabled-when: "prompt.studio-subcommand == reconcile"
        effect: call:parlay-studio-reconcile
        target: parlay-studio-reconcile

    operations:
      - type: read-file
        path: cached:resolution-context.studio-detection
        bind: detection

  no-studio-flag-domain-model:
    source: "@studio-support/studio-cli-hooks/no-studio-flag-opt-out"
    widget: yn-prompt
    description: |
      Boolean --no-studio flag added to parlay create-domain-model. When set (or when
      parlay.no_studio = true in project config), the trio command runs to completion
      and skips the Studio prompt entirely.

    data:
      inputs:
        - name: flag-value
          model: HookGate
          field: no-studio-flag
          from: command-argument

    elements:
      - name: flag-help
        widget: fmt.Println
        bind: flag-value
        format: "skip the Studio open-editor prompt at the end"
        visible-when: "always"

    actions:
      - name: toggle-no-studio
        widget: yn-prompt
        enabled-when: "always"
        effect: mutate:HookGate.no-studio-flag=true
        target: HookGate.no-studio-flag

    operations: []

  no-studio-flag-artifacts:
    source: "@studio-support/studio-cli-hooks/no-studio-flag-opt-out"
    widget: yn-prompt
    description: |
      Same --no-studio flag added to parlay create-artifacts. Identical semantics to
      the create-domain-model variant — silences the prompt for that invocation.

    data:
      inputs:
        - name: flag-value
          model: HookGate
          field: no-studio-flag
          from: command-argument

    elements:
      - name: flag-help
        widget: fmt.Println
        bind: flag-value
        format: "skip the Studio open-editor prompt at the end"
        visible-when: "always"

    actions:
      - name: toggle-no-studio
        widget: yn-prompt
        enabled-when: "always"
        effect: mutate:HookGate.no-studio-flag=true
        target: HookGate.no-studio-flag

    operations: []

  no-studio-flag-sync:
    source: "@studio-support/studio-cli-hooks/no-studio-flag-opt-out"
    widget: yn-prompt
    description: |
      Same --no-studio flag added to parlay sync. Identical semantics to the other
      trio-command variants.

    data:
      inputs:
        - name: flag-value
          model: HookGate
          field: no-studio-flag
          from: command-argument

    elements:
      - name: flag-help
        widget: fmt.Println
        bind: flag-value
        format: "skip the Studio open-editor prompt at the end"
        visible-when: "always"

    actions:
      - name: toggle-no-studio
        widget: yn-prompt
        enabled-when: "always"
        effect: mutate:HookGate.no-studio-flag=true
        target: HookGate.no-studio-flag

    operations: []

  studio-launch-failure-line:
    source: "@studio-support/studio-cli-hooks/studio-launch-failure-error"
    widget: prefixed-message
    description: |
      Error line printed to stderr after Studio's own output when an accepted Studio
      invocation crashes or exits non-zero. Names the subcommand and exit code, and
      reminds the designer that the trio command's prior artifact remains on disk.
      The trio command itself then exits non-zero so callers see the failure.

    data:
      inputs:
        - name: invocation
          model: StudioInvocation
          field: ""
          from: computed

    elements:
      - name: failure-status
        widget: prefixed-message
        bind: invocation
        format: "[ERR] parlay-studio {subcommand} exited with code {exit-code} — see Studio's output above. Trio-command artifact completed before Studio launched and is on disk."
        visible-when: "invocation.exit-code != 0"

    actions: []

    operations: []

cross-cutting:
  - id: runtime-studio-detection
    source: "@studio-support/studio-cli-hooks/detect-parlay-studio-at-runtime"
    target-files:
      - internal/config/context.go
      - internal/config/resolver.go
    target-creates:
      - internal/config/studio.go
    transform: |
      Introduce a StudioDetection record on the resolution Context, plus the
      version-compatibility check. At process startup (within ResolveActiveRoot or
      its caller PersistentPreRunE), perform exactly one Studio lookup: prefer the
      PARLAY_STUDIO env var when set (treating empty string as explicit suppression),
      fall back to PATH lookup when unset. Stat the resolved file, check the
      executable bit, and capture path + version + reason in the Context. Detection
      is read-only — never invoke Studio just to confirm. When detection is
      "Detected: true", compare the reported version against Core's compile-time
      expected range; on mismatch, emit a single one-line warning on stderr at the
      first successful detection in the process, then suppress it for the rest of
      the process via a sync.Once-style guard. A version mismatch never changes the
      Detected flag — Studio remains "detected" for hook purposes. The new
      internal/config/studio.go file owns the lookup helpers, version-parse,
      version-warning-once helper, and the StudioDetection struct; context.go embeds
      the value on Context (Context.StudioDetection() accessor); resolver.go calls
      into studio.go from its existing initialization path. Subsequent code reads
      Context.StudioDetection() instead of re-checking PATH or env.
    introduces:
      - "type StudioDetection struct { Detected bool; BinaryPath string; Version string; Reason StudioReason }"
      - "type StudioReason string (enum: detected, absent-from-path, suppressed-by-env, not-executable, version-unknown)"
      - "func detectStudio(env map[string]string, lookPath func(string) (string, error)) StudioDetection"
      - "func (c *Context) StudioDetection() StudioDetection"
      - "var expectedStudioVersionRange = \">=1.0.0\" (compile-time constant)"
      - "func emitStudioVersionWarningOnce(d StudioDetection) (only once per process)"
    caching: per-process
    backward-compatible: true

  - id: studio-hook-shared-helper
    source: "@studio-support/studio-cli-hooks/prompt-to-open-studio-at-workflow-hand-off-points"
    target-creates:
      - internal/commands/studio_hook.go
    transform: |
      Introduce the shared hook-point dispatch and Studio subprocess lifecycle in a
      new file. Public entry point: dispatchStudioHook(ctx, trioCmd, mode, root,
      featureCtx). The dispatch checks three gates in order — TTY interactivity
      (stdin AND stdout TTY), Studio detection (read from Context), and the
      --no-studio flag/config — and only when all three allow it, prints the
      one-line wording supplied by the trio command and reads y/N. On confirmation,
      invokes the appropriate parlay-studio subcommand synchronously via os/exec
      with inherited stdin/stdout/stderr, passes the active root and feature/page
      context as args, and waits. On non-zero exit, prints the "[ERR] parlay-studio
      ... exited with code N ..." failure line on stderr and propagates the
      non-zero exit to the trio command. Always-ask policy: no per-session memory.
      The helper is the only path that emits the "Open Studio?" text; trio commands
      call it but do not write the prompt directly. The mapping from trio-command
      to parlay-studio subcommand (create-domain-model → domain-edit; create-artifacts
      → artifacts-review; sync → reconcile) is a small hard-coded table here.
    introduces:
      - "func dispatchStudioHook(ctx *config.Context, trioCmd string, mode string, featureCtx string) error"
      - "func ttyInteractive() bool (stdin AND stdout both TTY)"
      - "func invokeStudioSubprocess(ctx *config.Context, subcommand, root, featureCtx string) error"
      - "var trioToStudioSubcommand = map[string]string{\"create-domain-model\":\"domain-edit\",\"create-artifacts\":\"artifacts-review\",\"sync\":\"reconcile\"}"
    caching: none
    backward-compatible: true

  - id: hook-dispatch-trio-create-domain-model
    source: "@studio-support/studio-cli-hooks/prompt-to-open-studio-at-workflow-hand-off-points"
    target-files:
      - internal/commands/extract_domain_model.go
    transform: |
      Add a hook-point dispatch call at the end of the create-domain-model command
      handler — immediately after the model file is written successfully and before
      the command returns. Compute the brownfield/greenfield mode from whether
      extractable signals were present: brownfield wording when the command produced
      a populated model from signals, greenfield wording when it wrote an empty stub.
      Pass the mode plus the active root through to dispatchStudioHook. A failure of
      the main work skips the hook entirely. Note: the intent presupposes a future
      rename from extract-domain-model to create-domain-model, which is tracked
      separately and out of scope here — wire the hook into the existing
      extract-domain-model command file.
    introduces: []
    caching: none
    backward-compatible: true

  - id: hook-dispatch-trio-create-artifacts
    source: "@studio-support/studio-cli-hooks/prompt-to-open-studio-at-workflow-hand-off-points"
    target-files:
      - internal/commands/create_artifacts.go
    transform: |
      Add a hook-point dispatch call at the end of the create-artifacts command
      handler — immediately after surface.md and/or infrastructure.md are written
      successfully. Pass mode "default" plus the active root and the feature
      context through to dispatchStudioHook. A failure of the main work skips the
      hook entirely.
    introduces: []
    caching: none
    backward-compatible: true

  - id: hook-dispatch-trio-sync
    source: "@studio-support/studio-cli-hooks/prompt-to-open-studio-at-workflow-hand-off-points"
    target-files:
      - internal/commands/sync.go
    transform: |
      Add a hook-point dispatch call at the end of the sync command handler —
      immediately after the textual sync report is produced. Pass mode "default"
      plus the active root and feature context through to dispatchStudioHook. The
      sync report remains the final stdout content; the hook prompt goes to the
      controlling TTY only when allowed by the gates.
    introduces: []
    caching: none
    backward-compatible: true

  - id: no-studio-flag-trio-commands
    source: "@studio-support/studio-cli-hooks/prompt-to-open-studio-at-workflow-hand-off-points"
    target-files:
      - internal/commands/extract_domain_model.go
      - internal/commands/create_artifacts.go
      - internal/commands/sync.go
      - internal/config/config.go
    transform: |
      Add a boolean --no-studio flag to each of the three trio command definitions
      via cobra's Flags().BoolVar registration. Help text (one line):
      "skip the Studio open-editor prompt at the end". The flag value is read by
      the trio command's RunE and passed through to dispatchStudioHook; an empty
      flag combined with a project-config no_studio = true also suppresses the
      prompt (logical OR). config.go gains a NoStudio bool on the project config
      struct (or an equivalent accessor), populated when the project's
      .parlay/config.yaml contains parlay.no_studio = true. The flag has no
      inverse --studio form — config-level disables can only be reverted by
      changing config. Passing --no-studio to a non-trio command produces a
      normal cobra "unknown flag" error, not silent acceptance.
    introduces:
      - "Flags().BoolVar(&noStudio, \"no-studio\", false, \"skip the Studio open-editor prompt at the end\") (per trio command)"
      - "config.NoStudio bool (read from parlay.no_studio key in .parlay/config.yaml)"
    caching: none
    backward-compatible: true

wiring:
  rules: []

bindings: {}

plan:
  modifies:
    - path: internal/config/context.go
      sources:
        - cross-cutting/runtime-studio-detection
    - path: internal/config/resolver.go
      sources:
        - cross-cutting/runtime-studio-detection
    - path: internal/commands/extract_domain_model.go
      sources:
        - cross-cutting/hook-dispatch-trio-create-domain-model
        - cross-cutting/no-studio-flag-trio-commands
    - path: internal/commands/create_artifacts.go
      sources:
        - cross-cutting/hook-dispatch-trio-create-artifacts
        - cross-cutting/no-studio-flag-trio-commands
    - path: internal/commands/sync.go
      sources:
        - cross-cutting/hook-dispatch-trio-sync
        - cross-cutting/no-studio-flag-trio-commands
    - path: internal/config/config.go
      sources:
        - cross-cutting/no-studio-flag-trio-commands

  creates:
    - path: internal/config/studio.go
      sources:
        - cross-cutting/runtime-studio-detection
    - path: internal/commands/studio_hook.go
      sources:
        - cross-cutting/studio-hook-shared-helper
    - path: internal/commands/studio_status_line.go
      sources:
        - component/studio-status-line
    - path: internal/commands/studio_version_warning.go
      sources:
        - component/version-mismatch-warning
    - path: internal/commands/studio_prompt_domain_model.go
      sources:
        - component/studio-prompt-domain-model
    - path: internal/commands/studio_prompt_artifacts.go
      sources:
        - component/studio-prompt-artifacts
    - path: internal/commands/studio_prompt_sync.go
      sources:
        - component/studio-prompt-sync
    - path: internal/commands/no_studio_flag_domain_model.go
      sources:
        - component/no-studio-flag-domain-model
    - path: internal/commands/no_studio_flag_artifacts.go
      sources:
        - component/no-studio-flag-artifacts
    - path: internal/commands/no_studio_flag_sync.go
      sources:
        - component/no-studio-flag-sync
    - path: internal/commands/studio_launch_failure_line.go
      sources:
        - component/studio-launch-failure-line

source-signatures:
