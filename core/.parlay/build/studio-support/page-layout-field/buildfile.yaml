feature: studio-support/page-layout-field
adapter: go-cli

# This feature is infrastructure-only. It has no surface.md and produces no
# components or routes. Every fragment in infrastructure.md translates to a
# cross-cutting entry — three new/changed loci in the Go internals plus a
# schema-doc edit that together form: "Core knows how to load a page-with-
# optional-layout, validates the layout tree against an adapter, exposes a
# closed-shape precheck that every consumer (codegen, status, repair, sync)
# can call uniformly, AND the page schema document itself names the optional
# ## Layout section so a new author reading the schema can discover it."
#
# All paths in cross-cutting target-files: and plan: are relative to the
# active root (core/) — the buildfile-validator resolves them against the
# root derived from the buildfile's location, NOT against the repo root.
#
# Lifecycle note: the four Go-side cross-cutting entries below
# (page-artifact-loader-with-optional-layout, layout-tree-schema-validator,
# layout-precheck-contract, page-schema-doc-mentions-layout-section) were
# implemented during prior build passes and are present on disk today. They
# remain in this buildfile because they own the intent → source-file
# traceability for the feature; codegen's diff machinery will classify them
# as stable on subsequent runs and preserve the existing source.
#
# Third sub-pass: the layout-schema-doc-tree-shape entry below is the new
# work for this pass. It edits internal/embedded/schemas/layout.schema.md to
# replace the existing "Out of scope (for this stub)" stub section with the
# concrete documentation for the layout-tree shape (file structure,
# vocabulary pinning syntax, container node shape, leaf/data-shape node,
# vocabulary-binding rule, per-mode value selection, and a forward
# reference to internal/agent/validate.go for the validation pass). The
# layout.schema.md file's universal-container-fields and figma: sections
# were landed by @studio-support/adapter-vocabulary-extension and
# @design-loop/design-loop respectively and stay byte-equivalent through
# this edit — only the "Out of scope" stub section is replaced.

models: {}

fixtures: {}

routes: []

components: {}

cross-cutting:
  - id: page-artifact-loader-with-optional-layout
    source: "@studio-support/page-layout-field/add-optional-layout-block-to-the-page-schema"
    target-files:
      - internal/parser/page.go
      - internal/parser/page_test.go
    transform: |
      Introduce a parser.ParsePageFile(path) entry point that reads a page
      artifact (spec/pages/<page>.page.md) and returns a Page struct carrying
      the existing top-level metadata (Name, Description, Owner, Status,
      Regions) PLUS an optional Layout field.

      Loader semantics:
        - Walk top-level body sections by `## ` heading match (NOT by position).
          Recognize the layout-bearing section by exact heading "## Layout"
          regardless of where it appears among siblings.
        - When "## Layout" is absent, return Page{Layout: nil}. Existing pages
          parse identically to today — this is the bit-for-bit-equivalent
          backward-compat guarantee.
        - When "## Layout" is present, decode its body as a fenced YAML code
          block into a Layout struct via gopkg.in/yaml.v3 (per the yaml-io
          convention). The Layout struct carries:
            * ComponentVocabulary string (e.g., "clarity@17") — required
            * SchemaVersion       int    — required
            * Nodes               []LayoutNode — recursive tree
        - LayoutNode has universal fields {ID, Type, Children, Direction, Gap,
          Padding, Alignment} per the layout schema universal-container-fields
          contract. Vocabulary-specific node fields are decoded into a generic
          map and validated downstream by ValidateLayout — the parser does not
          enumerate them.
        - The parser REJECTS (returns error) layout blocks that:
            * Omit ComponentVocabulary  -> error names the missing field
            * Omit SchemaVersion        -> error names the missing field
            * Carry a wiring field on any node (data-source / dataSource,
              binding, expression-string fields) -> error names the offending
              field, the offending node id, and the page path
            * Use a raw spacing/padding value where a token reference is
              required (e.g., "24px", bare integer) -> error names the
              offending node id, the offending field, and the page path
        - Vocabulary-against-adapter membership and component-type lookups are
          NOT enforced here — they live in ValidateLayout, called by the
          precheck. The parser only enforces shape rules that are intrinsic to
          the layout block itself.
        - Errors surface via fmt.Errorf("<verb-phrase>: %w", err) per the
          error-wrapping convention.

      The companion test file exercises every Verify-bullet from the
      add-optional-layout-block intent: presence/absence of ## Layout, missing
      schemaVersion, wiring rejection, raw-value rejection, position-
      independence of ## Layout among siblings, and id stability across a
      read-edit-write round-trip.

      Lifecycle: both files are present on disk from the previous build pass
      and satisfy the contract above. This entry continues to own the
      intent-to-file traceability; codegen's diff classifies it stable so
      long as the source remains intact.
    introduces:
      - "type Page struct { Name, Description, Owner, Status string; Regions []PageRegion; Layout *Layout }"
      - "type Layout struct { ComponentVocabulary string; SchemaVersion int; Nodes []LayoutNode }"
      - "type LayoutNode struct { ID, Type string; Children []LayoutNode; Direction, Alignment string; Gap, Padding string; Properties map[string]any }"
      - "func ParsePageFile(path string) (*Page, error)"
    caching: none
    backward-compatible: true

  - id: layout-tree-schema-validator
    source: "@studio-support/page-layout-field/define-the-layout-tree-schema"
    target-files:
      - internal/agent/validate.go
    transform: |
      Extend the existing agent.ValidateLayout entry point so that it covers
      every invariant declared in the Layout-Tree-Schema infrastructure
      fragment. The function's signature stays:
        func ValidateLayout(adapter *deepAdapter, layout *LayoutReference)
            []ValidationError
      Behavior additions (idempotent — already-passing inputs continue to
      pass):
        - Schema-version check: reject layout blocks whose SchemaVersion
          differs from the build's supported version. Emit
          ValidationError{Code: "layout-schema-version-unsupported",
          Context: "layout.schemaVersion", Message: names found vs expected,
          Fix: names both remediation paths}.
        - Recursive walk: descend into LayoutNode.Children to arbitrary depth,
          re-running the same per-node checks (component-type membership,
          variant membership, property type, allowed-children, raw-value-vs-
          token, unknown-token, universal-field-redeclared) at every level.
          Depth has no special cap — a 10-deep tree validates each level
          against the same rules.
        - Universal-field redeclaration: when a vocabulary component declares
          a property whose name collides with the universal-container-fields
          set {direction, gap, padding, alignment}, surface
          ValidationError{Code: "universal-field-redeclared", ...} naming the
          component and the offending field. (This rule is owned by the
          adapter-parse path; the layout validator merely surfaces it
          consistently when it crosses the layout boundary.)
        - Every error names BOTH the offending node id AND the offending
          field via the existing Context shape (e.g., Context: "node:<id>
          field:<name>"). Tests assert the substring presence.

      The layout schema document core/internal/embedded/schemas/layout.schema.md
      ALREADY documents the universal-container-fields contract — no edits to
      that file are required by this fragment. The validator code is the
      runtime enforcement of that documented contract.

      Lifecycle: the file is present on disk from the previous build pass and
      satisfies the contract above. This entry continues to own the
      intent-to-file traceability; codegen's diff classifies it stable so
      long as the source remains intact.
    introduces:
      - 'ValidationError code "layout-schema-version-unsupported"'
      - "Recursive descent over LayoutNode.Children with re-application of every per-node check"
    caching: per-process
    backward-compatible: true

  - id: layout-precheck-contract
    source: "@studio-support/page-layout-field/surface-layout-validation-as-a-precheck-contract-for-codegen"
    target-files:
      - internal/agent/precheck.go
      - internal/agent/precheck_test.go
    transform: |
      Introduce a single callable validation entry point — LayoutPrecheck —
      that aggregates every layout check (well-formedness, schema compliance,
      vocabulary membership, token correctness, no-wiring-in-layout) into a
      structured Verdict that consumers branch on uniformly.

      Function signature (stable):
        func LayoutPrecheck(page *parser.Page, adapter *deepAdapter) Verdict

      The Verdict shape is closed:
        type Verdict struct {
          Code     string // "ok" | one of the stable failure codes below
          File     string // page path; empty on success
          NodePath string // dot-path inside the layout tree; empty on success or block-level failures
          Found    string // offending value or verbatim parser error; empty on success
          Expected string // expected shape or list of valid values; empty on success
          Fix      string // human-readable remediation; empty on success
        }
      A passing verdict carries Code: "ok" and ALL OTHER FIELDS EMPTY.
      A failing verdict carries Code: <stable failure code> and ALL SIX FIELDS
      populated. There is no severity field — every failure is an error. The
      shape is closed; do not add fields without bumping the contract.

      Stable failure codes registered by this feature (exhaustive for this
      feature's surface; sibling features add their own codes in lockstep):
        - malformed-layout-block        (block-level YAML parse failure)
        - missing-schema-version        (schemaVersion key absent)
        - vocabulary-version-mismatch   (page declares clarity@17 vs adapter's clarity@16)
        - unknown-component-type        (node references type outside declared vocabulary)
        - raw-value-where-token-required (gap: 24px, padding: 16, etc.)
        - wiring-in-layout              (node carries dataSource/binding/expression)

      Implementation contract:
        - Pure function over its inputs. No file I/O. No network. No AI calls.
          No external state.
        - Deterministic: same (page, adapter) -> byte-identical Verdict every
          call.
        - Sub-millisecond on common-case pages.
        - Aggregates internal ValidateLayout errors and translates them to the
          stable verdict codes via a fixed code-map (e.g., internal
          "version-mismatch" -> verdict "vocabulary-version-mismatch";
          internal "unknown-component" -> verdict "unknown-component-type";
          internal "raw-value-where-token-required" -> verdict
          "raw-value-where-token-required" verbatim).
        - Returns the FIRST failure within a single page (callers get one
          verdict per page; aggregation across pages is the caller's
          responsibility).
        - Never auto-fixes. Never enforces policy. The caller decides whether
          to refuse-to-proceed, annotate state, or surface to the human.
        - When page.Layout == nil: returns Verdict{Code: "ok"}. A page without
          a layout is trivially valid for this contract.
        - When page.Layout != nil: runs each check in deterministic order
          (block-level shape -> schema-version -> vocabulary-version ->
          per-node membership/token/wiring) and returns the first failure or
          {Code: "ok"} on full pass.

      Companion ParsePagePrecheck helper for callers that have a path rather
      than a parsed page: parses then calls LayoutPrecheck; on parse failure,
      returns Verdict{Code: "malformed-layout-block", File: path, Found:
      <verbatim parse error>, Expected: "well-formed YAML conforming to the
      layout schema", Fix: <parser-emitted next step>}.

      The test file exercises every Verify-bullet from the precheck-contract
      intent: each failure code produces the right verdict shape, the
      ok-case carries only Code, the determinism-byte-equality test, and a
      multi-page walk yielding one verdict per page.

      Lifecycle: both files are present on disk from the previous build pass
      and satisfy the contract above. This entry continues to own the
      intent-to-file traceability; codegen's diff classifies it stable so
      long as the source remains intact.
    introduces:
      - "type Verdict struct { Code, File, NodePath, Found, Expected, Fix string }"
      - "func LayoutPrecheck(page *parser.Page, adapter *deepAdapter) Verdict"
      - "func ParsePagePrecheck(path string, adapter *deepAdapter) Verdict"
      - 'Stable error codes: malformed-layout-block, missing-schema-version, vocabulary-version-mismatch, unknown-component-type, raw-value-where-token-required, wiring-in-layout'
    caching: none
    backward-compatible: true

  - id: page-schema-doc-mentions-layout-section
    source: "@studio-support/page-layout-field/add-optional-layout-block-to-the-page-schema"
    target-files:
      - internal/embedded/schemas/page.schema.md
    transform: |
      Edit the embedded page-schema documentation so that the optional
      ## Layout section is discoverable from the schema doc itself. Today
      the parser supports ## Layout but the schema document — the
      authoritative reference for what may appear in a page artifact — does
      not mention it. A new author reading the schema therefore has no way
      to learn that the optional layout block exists.

      The edit ADDS a single new top-level section to the existing
      page.schema.md document. Existing sections (Template, Fields,
      Behavior, Parsing) remain in place and unchanged. The new section
      describes:

        (a) ## Layout is an OPTIONAL top-level section in the page Markdown
            body. Pages that omit it parse and behave exactly as today
            (bit-for-bit equivalent in all parser-visible respects). The
            schema doc explicitly states that ## Layout is OPTIONAL and
            NOT required — this is load-bearing for adoption of the
            change by projects whose pages do not have layouts yet.

        (b) When present, the body of the ## Layout section is a fenced
            YAML code block whose top-level keys are:
              - componentVocabulary (string, required) — e.g., "clarity@17"
              - schemaVersion       (integer, required)
              - nodes               (list, required) — a recursive tree of
                                    layout nodes
            The schema doc names the three required keys explicitly.

        (c) The ## Layout section may appear anywhere among the page's
            top-level body sections — order relative to other top-level
            sections is not significant. The parser matches by heading,
            not by position; a page that places ## Layout immediately
            after the frontmatter and one that places it after other
            sections produce identical parse trees.

        (d) The node-tree shape (universal-container-fields, recursive
            children, validation rules) is documented in the sibling
            layout.schema.md document, referenced by name. The page-schema
            doc only names the three top-level keys and forwards detail
            to layout.schema.md — it does not restate the node-tree shape
            inline.

        (e) The Fields table is extended with one new row:
              | Layout | No | `## Layout` heading with a fenced YAML block conforming to `layout.schema.md` |

      Wording rules (the build edit MUST hew to these to remain consistent
      with the rest of the feature's surfaces):
        - The schema doc MUST NOT call the layout block required at the
          page level. The word "optional" appears explicitly. The Fields
          table row reads "No" in the Required column.
        - The schema doc MUST NOT enumerate the node-tree shape inline.
          It forwards to layout.schema.md by name.
        - The schema doc MUST mention all three top-level YAML keys
          (componentVocabulary, schemaVersion, nodes) by their exact
          string spelling.

      This is purely a doc edit. No code is generated, no test scaffolding
      is added beyond the lightweight testcases that assert the new section
      and its required/optional framing are present.
    introduces:
      - "New top-level section ## Layout in page.schema.md (documentation only)"
      - "New row in the Fields table naming the optional ## Layout heading"
    caching: none
    backward-compatible: true

  - id: layout-schema-doc-tree-shape
    source: "@studio-support/page-layout-field/define-the-layout-tree-schema"
    target-files:
      - internal/embedded/schemas/layout.schema.md
    transform: |
      Edit the embedded layout-schema documentation so that the typed-tree
      shape promised by Intent #2 ("Define the Layout Tree Schema") is
      actually documented in the schema file. Today the file contains the
      universal-container-fields contract (landed by
      @studio-support/adapter-vocabulary-extension) and the optional figma:
      block (landed by @design-loop/design-loop), but the bottom of the file
      carries an "Out of scope (for this stub)" section that explicitly
      defers six concerns to this feature. This edit replaces that stub
      section with concrete documentation for each concern.

      The edit MUST preserve the existing sections byte-equivalent:
        - The header comment naming
          parlay-feature: studio-support/adapter-vocabulary-extension on the
          universal-container-fields section stays in place. That section is
          owned by adapter-vocabulary-extension; this edit does not touch it.
        - The "# Layout Schema" title, the opening prose, the
          "## Universal container fields" section (with its 4-field table),
          the "## Uniformity contract" section, the "## Universal-fields
          rule" section, the "## Migration posture" section, and the entire
          "## Optional `figma:` block (Design Loop)" section (including its
          inner header comment naming
          parlay-feature: design-loop/design-loop) all stay byte-equivalent.
        - Only the "## Out of scope (for this stub)" section at the bottom
          of the file is replaced. The replacement content is introduced
          with a NEW HTML comment marker that attributes the new sections
          to this feature:

            <!--
            parlay-section: cross-cutting
            parlay-feature: studio-support/page-layout-field
            parlay-cross-cutting-id: layout-schema-doc-tree-shape
            -->

      Content of the replacement section, broken out per concern:

      (a) **Top-level layout file structure** — a new "## Top-level
          structure" subsection that names the three top-level keys that
          appear at the root of a layout block (whether the block is
          embedded in a page artifact under ## Layout, or lives in a
          standalone *.layout.yaml file): `componentVocabulary` (string,
          required), `schemaVersion` (integer, required), `nodes` (list of
          layout nodes, required). The section explicitly refers FORWARD to
          internal/embedded/schemas/page.schema.md for the rule about how
          the same three keys appear inside a page Markdown's optional
          ## Layout YAML body — the layout schema doc owns the keys
          themselves; the page schema doc owns the embedding rule. Do NOT
          restate the page-embedding rule inline.

      (b) **Vocabulary pinning syntax** — a new "## Vocabulary pinning"
          subsection that documents `componentVocabulary: <name>@<version>`
          (e.g., `clarity@17`), explains the version-mismatch error path
          (a layout declaring `clarity@17` evaluated against an adapter
          registered as `clarity@16` fails with
          `vocabulary-version-mismatch` — names BOTH remediation paths:
          re-register the adapter at the declared version, or change the
          declaration to the registered version).

      (c) **Container node shape** — a new "## Container node shape"
          subsection. Documents the universal node fields that apply to
          every container node:
            - `id` (string, required) — stable identifier; preserved across
              round-trips per the round-trip-stability invariant.
            - `type` (string, required) — a vocabulary-qualified component
              type (e.g., `clarity.region`); validated against the adapter's
              componentVocabulary entry for the active version.
            - `children` (list of layout nodes, optional) — recursive
              nesting to arbitrary depth.
          The four universal container fields (`direction`, `gap`, `padding`,
          `alignment`) already documented in the "## Universal container
          fields" section above apply on every container node. This
          subsection cross-references that section by name rather than
          restating the four-field table.

      (d) **Leaf and data-shape node shape** — a new "## Leaf and data-shape
          nodes" subsection. Documents that a leaf node is a layout node
          with no `children` (e.g., a button, a label, a single data field
          display); a data-shape node is a leaf node whose `type` is a
          vocabulary component that consumes a typed data binding (e.g.,
          `clarity.datagrid`, `clarity.kpi-card`). Leaf and data-shape
          nodes carry the same universal node fields as container nodes
          (`id`, `type`, plus the universal container fields where the
          component opts in). Vocabulary-specific node fields are validated
          per (e) below.

      (e) **Vocabulary-binding rule** — a new "## Vocabulary-binding rule"
          subsection. States the rule that vocabulary-specific node fields
          (e.g., `headerLabel` on `clarity.region`, `density` on
          `clarity.datagrid`) are NOT enumerated in this schema; they are
          validated against the active adapter's componentVocabulary entry
          for the node's declared `type`. The rule names BOTH `adapter`
          (the artifact that registers vocabulary entries) and
          `componentVocabulary` (the block within the adapter that
          declares per-component properties) by their exact string
          spelling, so a reader can grep for either term and find this
          rule. Per-vocabulary variation is captured in the adapter, not
          in this schema.

      (f) **Per-mode value selection** — a new "## Per-mode value selection"
          subsection. Documents the rule that a layout MAY declare a
          `mode:` selector at the layout level (top-level alongside
          `componentVocabulary`, `schemaVersion`, `nodes`) AND a node MAY
          declare per-mode field values via a `mode:` key on individual
          fields, so a single layout can carry distinct values for
          different visual modes (e.g., dense vs. comfortable, light vs.
          dark). The subsection states that the `mode:` key is optional —
          a layout that does not declare it parses and validates exactly
          as today. When a node carries per-mode values for a field, the
          adapter's componentVocabulary entry for that type must declare
          the field as mode-aware; otherwise validation fails with
          `missing-mode-emit-form` (owned by
          @studio-support/adapter-vocabulary-extension and surfaced in the
          precheck verdict).

      (g) **Validation pass forward reference** — a final
          "## Validation pass" subsection. Does NOT restate the validation
          rules. Instead, names the validation pass entry point as
          `agent.ValidateLayout` (file:
          `internal/agent/validate.go`) and the consumer-facing precheck
          contract as `agent.LayoutPrecheck` (file:
          `internal/agent/precheck.go`). Lists the closed set of stable
          error codes that the precheck registers for THIS feature
          (malformed-layout-block, missing-schema-version,
          vocabulary-version-mismatch, unknown-component-type,
          raw-value-where-token-required, wiring-in-layout), notes that
          adjacent error codes (unknown-variant, unknown-token,
          universal-field-redeclared, missing-mode-emit-form) are owned
          by sibling features and surface through the same precheck
          contract, and forwards to the precheck contract for the verdict
          shape rather than restating it inline.

      Wording rules (load-bearing across the feature's surfaces):
        - The schema doc MUST NOT restate the universal-container-fields
          table — those four fields are already documented above and the
          new sections cross-reference that table by name.
        - The schema doc MUST NOT restate the validation-error verdict
          shape — that contract is owned by `internal/agent/precheck.go`
          and the page-schema doc, and is forward-referenced here.
        - The schema doc MUST name `componentVocabulary`, `schemaVersion`,
          and `nodes` by their exact string spelling (matching the
          page-schema doc's wording).
        - The schema doc MUST name BOTH `adapter` AND `componentVocabulary`
          in the vocabulary-binding rule, so the file is greppable from
          either side of the binding.
        - The schema doc MUST NOT contain the literal phrase "Out of scope
          (for this stub)" after this edit. That stub framing is what this
          edit replaces.

      This is purely a doc edit. No code is generated, no test scaffolding
      is added beyond the lightweight testcases that assert the new
      sections and their key terms are present.
    introduces:
      - "New section ## Top-level structure in layout.schema.md (documentation only)"
      - "New section ## Vocabulary pinning in layout.schema.md (documentation only)"
      - "New section ## Container node shape in layout.schema.md (documentation only)"
      - "New section ## Leaf and data-shape nodes in layout.schema.md (documentation only)"
      - "New section ## Vocabulary-binding rule in layout.schema.md (documentation only)"
      - "New section ## Per-mode value selection in layout.schema.md (documentation only)"
      - "New section ## Validation pass in layout.schema.md (documentation only, forward reference to internal/agent/validate.go and internal/agent/precheck.go)"
      - "New HTML comment marker attributing the replacement to parlay-feature: studio-support/page-layout-field"
    caching: none
    backward-compatible: true

