feature: parlay-tool/architectural-prose-artifact
adapter: go-cli

# Pure-infrastructure feature — documentation-and-tooling-only changes.
# No models (no domain entities introduced), no fixtures, no components,
# no routes. All work expressed as three cross-cutting entries, one per
# infrastructure fragment, each modifying existing files in the core source
# tree. Single-target project (no adapter-set.yaml) — legacy single-adapter
# shape applies; no `targets:` block, no `bindings:` block (no layouts).
#
# Path convention: this feature lives under the `core` child root, so all
# target-files and plan paths are relative to /workspace/parlay-dev/core/.
# The repo-level CLAUDE.md (at the parent root) is intentionally NOT
# listed as a target — its content is regenerated by `parlay upgrade`
# from the template in core/internal/deployer/claude.go, which IS a
# target. Per the dogfooding rule, edits flow source → build → upgrade
# redeploy → CLAUDE.md refresh. The repo-level CLAUDE.md will need a
# one-time manual sync after the code phase to pick up the new
# four-artifact framing until the next `parlay upgrade` runs.

models: {}

fixtures: {}

routes: []

components: {}

cross-cutting:
  # ---------------------------------------------------------------------------
  # Fragment 1: Co-equal spec-artifact framing
  # ---------------------------------------------------------------------------
  - id: co-equal-spec-artifact-framing
    source: "@parlay-tool/architectural-prose-artifact/restore-infrastructuremd-to-co-equal-spec-artifact-status"
    target-files:
      # Source of truth for the deployed CLAUDE.md template + skill titles.
      # Line 166 mirrors today's CLAUDE.md line 46 ("or legacy
      # infrastructure.md"); line 202 is the create-artifacts skill title
      # that needs four-artifact wording. `parlay upgrade` rewrites the
      # repo-level CLAUDE.md from this template, so this is the single
      # authoritative edit point for both.
      - internal/deployer/claude.go
      # Deployed skill prompt the AI agent reads. Needs to classify
      # architectural intents into infrastructure.md without steering
      # toward capabilities.yaml first. Per dogfooding rule, edit embedded
      # source; redeploy via `make sync-skills` happens at code-phase.
      - internal/embedded/skills/create-artifacts.skill.md
      # Build-feature skill: step 5 currently says "A feature needs at
      # least one of surface.md or infrastructure.md" — extend wording so
      # that capabilities.yaml is acknowledged co-equal alongside
      # infrastructure.md in the readiness model, and the four-artifact
      # framing flows through.
      - internal/embedded/skills/build-feature.skill.md
    transform: >
      Re-frame the spec layer as four co-equal artifacts in every
      developer- and agent-facing surface. In the claude.go embedded
      CLAUDE.md template, replace "(or legacy infrastructure.md)" with a
      four-artifact description naming surface.md, capabilities.yaml,
      infrastructure.md, and domain-model.yaml side-by-side, with one
      sentence each on what content goes where. Update the
      create-artifacts skill title in claude.go so its single-line
      description treats the three feature-local artifacts symmetrically
      (no "or" implying one is preferred). In create-artifacts.skill.md,
      drop wording that steers architectural intents toward
      capabilities.yaml first and add explicit recognition of
      architectural patterns (boundaries, probes, allowlists, dependency
      pins, feature-stable error codes outside the closed errors
      vocabulary, build-time constraints) as the trigger for authoring
      infrastructure.md without authoring capabilities.yaml. In
      build-feature.skill.md, update the "A feature needs at least one
      of..." line so capabilities.yaml is named alongside infrastructure.md
      as a valid backend-artifact choice. No occurrence of "legacy",
      "deprecated", or "to be replaced" associated with infrastructure.md
      should remain in any of these three files. The repo-level
      CLAUDE.md, which is regenerated by `parlay upgrade` from the
      template above, picks up the change on next upgrade — its hand-
      edit is handled by the code phase as a follow-on step, not as a
      target of this cross-cutting entry.
    introduces: []
    backward-compatible: true
    caching: none

  # ---------------------------------------------------------------------------
  # Fragment 2: Partial-migration semantics in migrate-capabilities
  # ---------------------------------------------------------------------------
  - id: partial-migration-semantics-in-migrate-capabilities
    source: "@parlay-tool/architectural-prose-artifact/make-migrate-capabilities-partial-migration-semantics-explicit"
    target-files:
      # The command itself: Short (line 25) is too brief and implies total
      # replacement; the run function (lines 30-88) needs to (a) print a
      # partitioned output (extracted vs retained vs deleted), (b) accept
      # a --dry-run flag, and (c) delete now-empty infrastructure.md. Note:
      # the current detector classifies by closed-vocabulary verbs; this
      # feature does not change detection logic per the fragment Notes,
      # only the surrounding documentation, output, dry-run flag, and the
      # empty-file delete behavior.
      - internal/commands/migrate_capabilities.go
      # The deployed skill doc the AI agent reads. Currently characterizes
      # the migrator as a one-way operation-extraction tool; needs to
      # frame it as moving operation-shaped content between two co-equal
      # artifacts, document the partition output explicitly, and reference
      # the --dry-run flag and the delete-on-empty behavior.
      - internal/embedded/skills/migrate-capabilities.skill.md
      # The deployer's skillTitle map for "migrate-capabilities" (line 223
      # of claude.go) is the single-line agent-facing description of the
      # command. Needs to mention partial-by-design so an agent listing
      # commands doesn't see "extract" as "replace all".
      - internal/deployer/claude.go
    transform: >
      Make the migrate-capabilities command's partial-migration semantics
      explicit across help text, stdout output, command behavior (dry-run
      + delete-empty), and the deployed skill doc. In
      migrate_capabilities.go, replace the cobra `Short:` string with one
      that names both the extracted and retained outputs as expected
      results, add a Long: description that calls partial migration the
      success case, add a `--dry-run` BoolP flag, and reshape the runtime
      output so that for each migrated feature the command prints two
      lists ("Extracted to capabilities.yaml" with feature-local fragment
      ids -> new operation ids, "Retained in infrastructure.md" with
      fragment ## headings) plus a "Deleted: infrastructure.md (was empty
      after extraction)" line when the post-extraction file has no
      remaining fragments. Empty lists print explicitly ("(none)" or "no
      operation-shaped fragments to migrate"), not suppressed. The
      command must delete the now-empty infrastructure.md (instead of
      leaving a zero-byte file) when every fragment migrated out — except
      under --dry-run, which prints the would-be partition with a
      "(dry run — no files written)" header and leaves the feature folder
      byte-identical to before the run. Exit code is zero on any
      successful migration including the all-retained case. In
      migrate-capabilities.skill.md, drop wording that frames
      infrastructure.md as the source the migrator empties; rewrite to
      frame the migration as moving operation-shaped content between two
      co-equal artifacts, document the partition output as the expected
      outcome shape, mention --dry-run as the preview path, and reference
      the four-artifact spec layer. Update the claude.go skillTitle entry
      for "migrate-capabilities" so the one-line description names both
      retained and extracted outputs.
    introduces:
      - "--dry-run flag on the migrate-capabilities cobra command"
      - "Partition-aware output renderer (extracted / retained / deleted) in the run handler"
      - "Empty-file deletion branch in the run handler"
    backward-compatible: true
    caching: none

  # ---------------------------------------------------------------------------
  # Fragment 3: Architectural scope in infrastructure.schema.md
  # ---------------------------------------------------------------------------
  - id: architectural-scope-in-infrastructure-schema
    source: "@parlay-tool/architectural-prose-artifact/clarify-architectural-scope-in-infrastructureschema-md"
    target-files:
      # The primary subject of this fragment. Per dogfooding rule, the
      # authoritative copy lives at internal/embedded/schemas/ (under
      # core/) and is redeployed to .parlay/schemas/ at the repo root by
      # `parlay upgrade`. The deployed copy is therefore derived — only
      # the embedded source needs the rewrite.
      - internal/embedded/schemas/infrastructure.schema.md
      # Symmetric cross-reference at the introduction. Currently says
      # "Replaces the prose-shaped operation fragments that used to live
      # in infrastructure.md" — needs to be reframed as "Operation-shaped
      # content lives here. Architectural prose lives in infrastructure.md."
      - internal/embedded/schemas/capabilities.schema.md
    transform: >
      Rewrite the introductory section of infrastructure.schema.md to
      describe the artifact's purpose as "architectural prose for
      concerns that do not reduce to operations," and cross-reference
      capabilities.schema.md for operation-shaped content. Add a
      "When to use infrastructure.md vs capabilities.yaml" prose section
      (not a closed decision table; the schema does not auto-classify)
      with one paragraph each on the two artifacts and a worked-example
      list. Replace the schema's existing fragment examples with four
      drawn from real architectural categories — (a) "SDK import boundary"
      as a boundary example, (b) "External-system startup probe" as a
      probe example, (c) "Wrapper API allowlist" as an allowlist example,
      (d) "Library version pin" as a dependency-pin example — each
      populating the existing fragment field set (Name, Source intent,
      Affects, Behavior, Invariants) without changing the field
      semantics. Note explicitly in the "When to use" section that the
      four categories are representative, not exhaustive (other
      architectural concerns also belong here). Exclude Parlay's own
      historical infrastructure.md fragments (skill deployment, registry
      traversal, validation pipeline) from the schema's example set, and
      note the exclusion is by design. In capabilities.schema.md, replace
      the "Replaces the prose-shaped operation fragments that used to
      live in infrastructure.md" framing at the top of the file with a
      symmetric cross-reference: "Operation-shaped content lives here.
      Architectural prose for boundaries, probes, allowlists, and
      dependency pins lives in infrastructure.md — see
      infrastructure.schema.md." Field set is unchanged. Portability
      lint is unchanged. No new validator rule rejects operation-shaped
      fragments in infrastructure.md — the schema remains advisory.
    introduces:
      - "Four worked example fragments in infrastructure.schema.md: SDK import boundary, External-system startup probe, Wrapper API allowlist, Library version pin"
      - "When to use infrastructure.md vs capabilities.yaml section (prose, not a decision table) in infrastructure.schema.md"
      - "Symmetric cross-reference at the top of capabilities.schema.md"
    backward-compatible: true
    caching: none

# No wiring rules (no layout-bearing pages in this feature).
# No bindings (no layout-bearing pages in this feature).

plan:
  modifies:
    - path: internal/deployer/claude.go
      sources:
        - cross-cutting/co-equal-spec-artifact-framing
        - cross-cutting/partial-migration-semantics-in-migrate-capabilities
    - path: internal/embedded/skills/create-artifacts.skill.md
      sources:
        - cross-cutting/co-equal-spec-artifact-framing
    - path: internal/embedded/skills/build-feature.skill.md
      sources:
        - cross-cutting/co-equal-spec-artifact-framing
    - path: internal/commands/migrate_capabilities.go
      sources:
        - cross-cutting/partial-migration-semantics-in-migrate-capabilities
    - path: internal/embedded/skills/migrate-capabilities.skill.md
      sources:
        - cross-cutting/partial-migration-semantics-in-migrate-capabilities
    - path: internal/embedded/schemas/infrastructure.schema.md
      sources:
        - cross-cutting/architectural-scope-in-infrastructure-schema
    - path: internal/embedded/schemas/capabilities.schema.md
      sources:
        - cross-cutting/architectural-scope-in-infrastructure-schema

