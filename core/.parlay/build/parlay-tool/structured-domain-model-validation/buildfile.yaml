feature: parlay-tool/structured-domain-model-validation
schema_version: 1
adapter: go-cli

# This is a pure-infrastructure feature: the designer group produced only
# infrastructure.md (three architectural-prose fragments) — no surface.yaml,
# capabilities.yaml, or domain-model.yaml, and dialogs.md is an intentional
# CLI/backend stub. The buildfile therefore carries only cross-cutting: entries
# (one per intent), a plan: derived from their target files, and
# source-signatures:. There are no components:, routes:, models:, wiring:, or
# bindings: (no layout-bearing pages).

fixtures:
  # Fixtures are description-only named scenarios. Because models: is deprecated,
  # fixture data: blocks are intentionally omitted (a data: key referencing an
  # undefined model would trip missing-fixture-model). The concrete domain-model
  # YAML each scenario stands for is supplied inline in the testcase input steps.
  clean-model:
    description: >
      A well-formed domain-model.yaml — schema_version:1, one entity with a
      valid field type, no relationships/enums/operations issues, and NO
      operations: block. Produces zero findings.
  model-two-violations:
    description: >
      A domain-model.yaml carrying exactly two distinct violations: one entity
      field whose type is outside the closed set (field-type-outside-closed-set)
      and one relationship with an unrecognized cardinality
      (relationship-cardinality-unknown). Produces a two-element finding list.
  model-bad-field-type:
    description: >
      A domain-model.yaml with a single entity field whose type is outside the
      closed primitive/enum set. Exercises the field-owned element path
      entities.<E>.fields.<F>.
  model-unknown-cardinality:
    description: >
      A domain-model.yaml with a single relationship whose cardinality is not in
      the closed set. Exercises the relationship-end element path
      relationships.<R>.cardinality.
  model-missing-schema-version:
    description: >
      A domain-model.yaml that omits the top-level schema_version. A whole-model
      (ownerless) finding — exercises the distinguished whole-model path token.
  model-unparseable:
    description: >
      Byte content that is not valid YAML. Under --json this must emit a single
      finding with the stable parse-failure code (invalid-yaml) and the output
      must remain valid JSON — never a crash or a non-JSON error on stdout.
  model-with-operations:
    description: >
      A well-formed domain-model.yaml that additionally carries a populated
      (non-empty) deprecated operations: block. Exercises the
      domain-operations-deprecated emission site — warning in authoring mode,
      error in build mode.
  model-empty-operations:
    description: >
      A well-formed domain-model.yaml whose operations: block is present but
      empty (or absent). Must emit NO domain-operations-deprecated finding.

cross-cutting:
  - id: json-validation-mode
    source: "@parlay-tool/structured-domain-model-validation/json-validation-mode-for-parlay-validate-type-domain-model"
    target-files:
      - internal/commands/validate.go
      - internal/agent/validate.go
    transform: >
      Give `parlay validate --type domain-model` a structured, per-violation
      JSON mode and stdin input, without disturbing the existing human path.

      In internal/commands/validate.go (runValidate): today `--type domain-model`
      always routes through agent.ValidateDomainModel (the plain Validator that
      collapses every violation into one synthetic schema-validation-failed
      error). Add a branch so that when validateJSON is set AND validateType ==
      "domain-model", the command instead calls agent.ValidateDomainModelStructured
      (already present in internal/agent/validate_domain_model.go) and emits its
      full []ValidationError as the JSON array via the existing outputValidate /
      validateJSONResult convention — one entry per violation, never collapsed,
      and `[]` for a clean model. Under this JSON domain-model branch the command
      exits 0 whether or not findings are present (a finding list is a query
      result, not a command failure): do NOT return NewExitCodeError(1) on a
      non-empty list here, unlike the generic outputValidate path. When
      validateJSON is absent, the domain-model path is unchanged — it keeps
      routing through ValidateDomainModel and preserves today's human output and
      non-zero-on-invalid exit.

      Stdin input: accept `-` as the positional path argument. When path == "-",
      read the model bytes from os.Stdin (cmd.InOrStdin()) instead of
      os.ReadFile; a real path and `-` are mutually exclusive and, for identical
      bytes, must produce an identical finding set. Pass the stdin bytes straight
      into ValidateDomainModelStructured (its signature is (path, content); use a
      synthetic path label such as "<stdin>" so the whole-model token / messages
      stay stable). Note the existing invalid-yaml finding emitted by
      ValidateDomainModelStructured Pass 0 already satisfies the "stable
      parse-failure code, output remains valid JSON" invariant for unparseable
      input — no new code is required for that, only correct routing.

      Authoring-mode severity + JSON shape: findings emitted under --json carry
      severity resolved for authoring mode (the editor's context, where
      domain-operations-deprecated is a warning). Add a Severity field to
      agent.ValidationError in internal/agent/validate.go (json:"severity,omitempty")
      so the emitted JSON matches the reused finding convention
      (code, message, context, fix, severity) used by project-validation output —
      no parallel finding schema. The build path resolves build-mode severity
      separately and is unaffected by this flag (see the emit-domain-operations-deprecated
      entry for how severity is drawn from the existing per-mode RuleSeverity table).
    introduces:
      - "ValidationError.Severity string (json:\"severity,omitempty\") in internal/agent/validate.go"
      - "domain-model --json branch in runValidate routing to ValidateDomainModelStructured with exit-0-as-query semantics"
      - "stdin (`-`) model input reading cmd.InOrStdin() in runValidate"
    caching: none
    backward-compatible: true

  - id: element-path-on-every-finding
    source: "@parlay-tool/structured-domain-model-validation/machine-usable-element-path-on-every-finding"
    target-files:
      - internal/agent/validate_domain_model.go
      - internal/embedded/schemas/domain-model.schema.md
    transform: >
      Guarantee that every finding emitted by ValidateDomainModelStructured
      carries a machine-usable, deterministic element path, and document the
      grammar next to the schema's validation table.

      Placement decision (resolves the intent's build-time open question):
      the structured element path lives in the EXISTING ValidationError.Context
      field, promoted from a free-text locator to a guaranteed structured-path
      contract — NOT a new dedicated field. Rationale: intent #1 requires "no
      parallel finding schema" and names the reused convention as
      (code, message, path/context, fix, severity); and nearly every emission
      site in ValidateDomainModelStructured already writes a dotted path into
      Context (entities.<E>.fields.<F>.type, entities.<E>.fields.<F>.target,
      enums.<E>.values.<V>.tone, relationships.<R>.from|to|cardinality,
      operations.<Op>.input[<i>]). The remaining work:

      (1) Introduce a single distinguished whole-model path token constant —
      wholeModelPathToken = "<domain-model>" (angle-bracketed so it can never
      collide with a real dotted path, whose roots are entities./relationships./
      enums./operations.). Use it for the ownerless findings that currently do
      NOT carry a structured element locator: invalid-yaml (Pass 0 today writes
      the file path into Context — replace with the token) and
      missing-schema-version / schema-version-newer-than-binary /
      schema-version-unreachable (today write the bare "schema_version" string —
      replace with the whole-model token, since these are whole-model findings
      per the intent, not element-owned).

      (2) Audit every append of a ValidationError in ValidateDomainModelStructured
      to confirm Context is populated and non-blank at every site; no finding may
      carry a blank element path.

      (3) Document the closed, versioned path grammar in
      internal/embedded/schemas/domain-model.schema.md adjacent to the existing
      validation table: entities.<name>.fields.<name>[.type|.target|.enum],
      relationships.<name>.<end> (end in {from, to, cardinality}),
      enums.<name>.values.<value>.tone, operations.<name>.input[<index>], and the
      whole-model token "<domain-model>" for ownerless findings. State that the
      grammar is closed and extended in the same change that adds a rule pointing
      at a new element kind (per-mode versioning with the schema).

      Determinism: paths are computed from the model position of the offending
      value, so two runs over identical bytes produce identical paths — no map
      iteration order may leak into a path string (the existing sites already
      build paths from named fields, preserve that).
    introduces:
      - "wholeModelPathToken constant (\"<domain-model>\") in internal/agent/validate_domain_model.go"
      - "path-grammar documentation block adjacent to the validation table in internal/embedded/schemas/domain-model.schema.md"
    caching: none
    backward-compatible: true

  - id: emit-domain-operations-deprecated
    source: "@parlay-tool/structured-domain-model-validation/emit-domain-operations-deprecated-in-authoring-mode"
    target-files:
      - internal/agent/validate_domain_model.go
    transform: >
      Add the missing emission site for domain-operations-deprecated. The code is
      already declared in the per-mode severity table (internal/agent/validation_mode.go:
      authoring = warning, build = error) but nothing ever emits it, so a model
      with a populated deprecated operations: block validates clean today.

      In ValidateDomainModelStructured, after the existing passes, add a
      read-only presence check: when the parsed model's operations: block is
      present and non-empty (len(dm.Operations) > 0), append exactly one
      ValidationError with Code "domain-operations-deprecated", a message noting
      the block is deprecated, Context set to the whole-model token "<domain-model>"
      (the block spans the model; see the element-path entry), and a Fix that
      names the migration path: "migrate the operations: block via
      `parlay migrate-domain-operations`". A model with no operations: block, or
      an empty one, emits none. The check is read-only — it must not mutate,
      reorder, or drop the operations: block (validation operates on []byte and
      never writes; keep it that way).

      Severity: draw it from the existing per-mode RuleSeverity table via
      RuleSeverity("domain-operations-deprecated", mode) — do NOT introduce a new
      severity rule. Authoring mode yields warning (the --json / editor path,
      per the json-validation-mode entry); build mode yields error, so a populated
      deprecated block fails the build exactly as the table already promises. See
      the OPEN QUESTION recorded for the code phase on how mode is threaded into
      the structured validator (mode parameter vs. mode-aware variant) — the fixed
      invariant is same code, warning in authoring, error in build.

      This is a deliberate latent-behavior correction: a model that validated
      clean only because the check was missing will now surface the finding it
      always should have (documented as intended in infrastructure.md), not a
      regression.
    introduces:
      - "operations-block presence check emitting domain-operations-deprecated in ValidateDomainModelStructured"
    caching: none
    backward-compatible: true

plan:
  modifies:
    - path: internal/commands/validate.go
      sources: [cross-cutting/json-validation-mode]
    - path: internal/agent/validate.go
      sources: [cross-cutting/json-validation-mode]
    - path: internal/agent/validate_domain_model.go
      sources:
        - cross-cutting/element-path-on-every-finding
        - cross-cutting/emit-domain-operations-deprecated
    - path: internal/embedded/schemas/domain-model.schema.md
      sources: [cross-cutting/element-path-on-every-finding]

