                  preserves-unlisted: true
                - lineage: show-pipeline-phase-per-feature-in-status
                  mode: extend
                  before:
                    title: Show pipeline phase per feature in status
                    slug: show-pipeline-phase-per-feature-in-status
                    goal: Let a designer or agent see, at a glance, how far each feature has progressed through the parlay pipeline without having to manually inspect each feature folder.
                    persona: Designer or agent operating on a parlay project.
                    priority: P0
                    context: Running `parlay status` (or `/parlay-status`) inside a parlay project. Today it shows the active root and a flat list of feature identifiers; the user has no way to tell which features are still in early authoring versus which already have generated code.
                    action: Compute a phase value per feature by reusing the file-existence checks already encoded in `core/internal/commands/check_readiness.go`, and add it as a new column in the existing feature listing.
                    objects:
                        - feature
                        - pipeline phase
                        - intents.md
                        - dialogs.md
                        - surface.md
                        - infrastructure.md
                        - buildfile.yaml
                    constraints:
                        - 'Phase vocabulary, in pipeline order: `intents | dialogs | artifacts | build | done`. Exactly these five values, lowercase, no others. The `code` phase is intentionally excluded — generated code is not tracked as a per-feature pipeline state in this command.'
                        - 'Phase semantics: the furthest stage whose required on-disk artifact(s) exist for that feature. `done` means all four pre-terminal phases (intents, dialogs, artifacts, build) are complete on disk. The engineering spec under `spec/handoff/<feature>/specification.md` is NOT required for `done`.'
                        - Reuse the file-existence checks from `core/internal/commands/check_readiness.go` rather than re-implementing path resolution or stage gating. If reuse requires a small refactor (e.g. extracting a helper that returns "what exists" without exit codes), prefer that over duplication.
                        - The phase column appears in BOTH the human listing and the `--json` output. In the human output it sits to the right of the feature identifier in each per-root section's tabwriter; in JSON it appears as a `phase` field on each feature entry.
                        - 'The human output is hierarchical when the active root is a parent: parent root header → parent features (with phase column) → for each registered child root, a child header → that child''s features (with phase column). When the active root is a child, only that child''s section is printed. See the "Aggregate status across parent and child roots" intent for the cross-root semantics.'
                        - Must not error or skip features when an upstream artifact is missing — every listed feature gets exactly one phase value, even if it is still at `intents`.
                    verify:
                        - A feature with only `intents.md` reports phase `intents`.
                        - A feature with `intents.md` and `dialogs.md` reports phase `dialogs`.
                        - A feature with `intents.md`, `dialogs.md`, and either `surface.md` or `infrastructure.md` (or both) reports phase `artifacts`.
                        - A feature that additionally has a buildfile under `.parlay/build/<feature>/buildfile.yaml` reports phase `build`.
                        - A feature whose intents, dialogs, artifacts, and buildfile all exist on disk reports phase `done`.
                        - Running `parlay status` against a bare-parent root (no features at parent, only child roots) prints the parent header with zero features, followed by each child root's header and its feature listing with the phase column populated.
                        - Running `parlay status` against a parent root with both parent-owned features and registered children prints the parent's features (with phase column) first, then each child root section in registration order.
                    questions:
                        - (none)
                  after:
                    title: Show pipeline phase per feature in status
                    slug: show-pipeline-phase-per-feature-in-status
                    goal: Let a designer or agent see, at a glance, how far each feature has progressed through the parlay pipeline without having to manually inspect each feature folder.
                    persona: Designer or agent operating on a parlay project.
                    priority: P0
                    context: Running `parlay status` inside a parlay project. It shows the active root and a list of feature identifiers; without a phase the user cannot tell which features are still in early authoring versus which already have generated code.
                    action: Compute a phase value per feature and add it as a new column in the existing feature listing.
                    objects:
                        - feature
                        - pipeline phase
                        - intents.md
                        - dialogs.md
                        - surface.yaml
                        - infrastructure.md
                        - capabilities.yaml
                        - buildfile.yaml
                    constraints:
                        - 'Phase vocabulary, in pipeline order: `planned | intents | dialogs | artifacts | build | done`. Exactly these six values, lowercase, no others, plus the off-ladder value `hand-authored` for a declared unit, which is not a rung and does not participate in the ordering. The `code` phase is intentionally excluded.'
                        - '`planned` is a feature that exists but promises nothing yet: its `intents.md` parses to zero intents. Every feature is born here, because `add-feature` writes both founding documents eagerly and the scaffolded `intents.md` is commented out precisely so it parses empty.'
                        - 'Phase semantics below the artifacts rung are CONTENT-based, not existence-based: `intents` requires at least one parsed intent, `dialogs` at least one parsed dialog. File presence cannot answer this question, because `add-feature` creates both files at feature birth.'
                        - The terminal rung measures completion evidence — artifacts plus both build outputs — and checks the founding documents for structural presence only. It does not read dialog content and infers nothing from finding none; a backend feature legitimately has no dialog turns, and content validity at that altitude belongs to the build and readiness gates.
                        - A founding document that cannot be read or parsed is treated as present-and-authored, never as empty. An unreadable file is the weakest possible evidence, and must never be the reason a feature is reported as emptier than it is.
                        - The phase column appears in BOTH the human listing and the `--json` output.
                        - 'The human output is hierarchical when the active root is a parent: parent root header, parent features, then each registered child root''s header and features.'
                        - Must not error or skip features when an upstream artifact is missing — every listed feature gets exactly one phase value, even if it is still at `planned`.
                    verify:
                        - A feature created by `parlay add-feature` and not yet edited reports phase `planned`.
                        - A feature whose `intents.md` carries at least one parsed intent, with only the scaffolded `dialogs.md`, reports phase `intents`.
                        - A feature with at least one parsed intent and at least one parsed dialog reports phase `dialogs`.
                        - A feature that additionally has `surface.yaml`, `capabilities.yaml` or `infrastructure.md` reports phase `artifacts`.
                        - A feature that additionally has a buildfile under `.parlay/build/<feature>/buildfile.yaml` reports phase `build`.
                        - A feature with artifacts, a buildfile and testcases reports `done` even when its `dialogs.md` carries zero parsed dialog turns.
                        - A feature whose `intents.md` cannot be read is not reported as `planned`.
                    questions: []
