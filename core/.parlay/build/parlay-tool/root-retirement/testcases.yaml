schema_version: 3
feature: parlay-tool/root-retirement
framework: "Go stdlib testing (sibling _test.go files per the adapter's tests-alongside convention)"
# Nine suites, one per infrastructure.md fragment. Cases come 1:1 from each
# fragment's Invariants: bullets — the criterion text on every case is the
# bullet's own wording, copied verbatim, with the ref citing the fragment in
# @feature/infrastructure:<fragment-slug> form.
#
# SHAPE NOTE (recorded deliberately): this feature has no surface.yaml and no
# capabilities.yaml, so its criteria live in infrastructure.md Invariants.
# The v2/v3 suite kind: discriminator is closed at {presentation, operation}
# and has no infrastructure member yet — that gap is the subject of the
# specced-but-unbuilt feature parlay-tool/testcases-infrastructure-suite-kind.
# Until it ships, these suites carry kind: presentation with
# component: cross-cutting/<id> and source_refs citing the infrastructure
# fragment, which validates mechanically and keeps full criterion accounting
# (the alternative, the v1 no-kind shape, is testcases-v1-unsupported since
# v0.3). When that feature ships, regenerate this file with kind:
# infrastructure per the regenerate policy.
#
# The steps use the closed testcases vocabulary; for a CLI feature,
# `action: render` with a `value:` carrying the invocation means "run the
# command in this configuration" (the convention established by the
# status-feature-phases and architectural-prose-artifact suites), and
# verify: state/error/file-* assert on the resulting process behavior and
# on-disk effects.
suites:
    # ===========================================================================
    # Suite 1 — Retirement target and destination preconditions
    # ===========================================================================
    - kind: presentation
      name: retirement-target-and-destination-preconditions
      file: internal/commands/retire_root_test.go
      component: cross-cutting/retirement-target-and-destination-preconditions
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
      intent: "@parlay-tool/root-retirement/end-a-subproject-without-pretending-it-never-happened"
      cases:
        - name: a target naming exactly one registered child resolves, naming none refuses with the registered roots enumerated
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A target naming exactly one registered child root resolves; a target naming none is refused and the refusal enumerates the registered roots."
          exercises: [retire-root-preflight]
          observes: [target-resolution, retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> is exactly one registered child"
            - verify: state
              target: target-resolution
              expected: "resolved to the single registered child root"
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> matches no registered child"
            - verify: error
              target: retire-root-preflight
              expected: "refused, and the refusal lists every registered child root by name"
        - name: a target matching more than one candidate is refused without selecting one
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A target matching more than one candidate is refused without selecting one."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> matches two registered children"
            - verify: error
              target: retire-root-preflight
              expected: "refused; no candidate is selected by ordering or proximity"
        - name: an unregistered directory carrying root configuration is refused as a target
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A directory carrying root configuration that is not registered is refused as a target."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> is a directory with .parlay config but no roots.yaml entry"
            - verify: error
              target: retire-root-preflight
              expected: "refused, stating the directory looks like a root but is not registered"
        - name: the parent root holding shared resources and the registration cannot be the target
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "The root holding the shared resources and the root registration cannot be resolved as a target."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> naming the parent root itself"
            - verify: error
              target: retire-root-preflight
              expected: "refused; ending the parent is the project ending, not a subproject ending"
        - name: an existing destination refuses before the root's contents are read
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "An existing destination refuses the run before the root's contents are read."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight, content-reads]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> with .parlay/retired/<name>/ already present"
            - verify: error
              target: retire-root-preflight
              expected: "refused naming the existing destination and both possible explanations"
            - verify: state
              target: content-reads
              expected: "zero reads of the retiring root's contents occurred"
        - name: no enumeration, sweep or content read happens before resolution and destination checks succeed
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "No enumeration, sweep or content read occurs before resolution and destination checking have both succeeded."
          exercises: [retire-root-preflight]
          observes: [content-reads]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root with a failing target resolution, instrumented to record file access"
            - verify: state
              target: content-reads
              expected: "no enumeration, sweep, or content read preceded the resolution and destination checks"
    # ===========================================================================
    # Suite 2 — Feature disposition preflight
    # ===========================================================================
    - kind: presentation
      name: feature-disposition-preflight
      file: internal/commands/root_dispositions_test.go
      component: cross-cutting/feature-disposition-preflight
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
      intent: "@parlay-tool/root-retirement/say-what-became-of-every-feature-in-the-root"
      cases:
        - name: a complete record with closed-set terms and rationales passes the preflight
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record naming every enumerated feature exactly once, each carrying a term from the closed set and a rationale, passes the preflight."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record covering every enumerated feature exactly once, valid terms, rationales present"
            - verify: state
              target: disposition-preflight
              expected: "preflight passes"
        - name: a record omitting an enumerated feature is refused naming the omitted feature
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record omitting an enumerated feature is refused, naming the omitted feature."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record missing one enumerated feature"
            - verify: error
              target: disposition-preflight
              expected: "refused, and the refusal names the omitted feature"
        - name: a record naming a feature the enumeration did not produce is refused naming it
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record naming a feature the enumeration did not produce is refused, naming it."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record naming one feature that is not in the root"
            - verify: error
              target: disposition-preflight
              expected: "refused, and the refusal names the extra entry"
        - name: a record naming one feature more than once is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record naming one feature more than once is refused."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record naming the same feature twice"
            - verify: error
              target: disposition-preflight
              expected: "refused as a duplicate"
        - name: a term outside the closed set of three is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A term outside the closed set of three is refused."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record with term 'abandoned'"
            - verify: error
              target: disposition-preflight
              expected: "refused, naming the three accepted terms"
        - name: a valid term with no rationale is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A disposition carrying a valid term and no rationale is refused."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record entry with term delivered-and-deleted and empty rationale"
            - verify: error
              target: disposition-preflight
              expected: "refused; a term with no rationale is a classification nobody can check"
        - name: the rationale is never parsed and never widens the accepted terms
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A rationale is never parsed and never widens the accepted terms; the same three terms are accepted whatever any rationale says."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "records whose rationales contain term-like text, YAML syntax, and directives"
            - verify: state
              target: disposition-preflight
              expected: "acceptance decisions identical to the same records with plain rationales; only the three closed terms accepted"
        - name: a delivery that was a removal is recordable as delivered-and-deleted with the rationale carrying the story
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature whose delivery was the removal of something, witnessed only by markers on other features' files that this run deletes, is recordable as delivered-and-deleted with that stated in its rationale."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record entry: term delivered-and-deleted, rationale describing the retraction and its markers"
            - verify: state
              target: disposition-preflight
              expected: "accepted with no fourth term involved"
        - name: a feature carrying only a placeholder baseline is enumerated and needs a disposition
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature carrying only a placeholder baseline is enumerated and requires a disposition like any other."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "root containing a feature whose only build state is a placeholder baseline; record omits it"
            - verify: error
              target: disposition-preflight
              expected: "refused naming that feature — it is enumerated like any other"
        - name: a feature carrying an incomplete artifact subset is enumerated and needs a disposition
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature carrying an incomplete subset of the build artifacts its siblings carry is enumerated and requires a disposition like any other."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "root where one feature has buildfile only, siblings have buildfile+testcases; record omits it"
            - verify: error
              target: disposition-preflight
              expected: "refused naming that feature"
        - name: buildfile-and-testcases without a coverage review is not classified as unbuilt
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature with a buildfile and testcases and no coverage review is not classified as unbuilt on that basis."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "feature with buildfile.yaml and testcases.yaml, no coverage-decisions.yaml, declared delivered-and-deleted"
            - verify: state
              target: disposition-preflight
              expected: "the declared term stands; nothing is inferred from the artifact set"
        - name: no mutation occurs while the preflight is unsatisfied
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "No mutation occurs while the preflight is unsatisfied."
          exercises: [disposition-preflight]
          observes: [project-state]
          steps:
            - action: render
              target: disposition-preflight
              value: "any refused record, followed by a full tree comparison"
            - verify: state
              target: project-state
              expected: "byte-identical to before the run"
        - name: the disposition record is readable alongside the preserved contents after a completed run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "The disposition record, rationales included, is present and readable alongside the preserved contents after a completed run."
          exercises: [disposition-preflight]
          observes: [disposition-record-file]
          steps:
            - action: render
              target: disposition-preflight
              value: "completed retirement"
            - verify: file-exists
              target: disposition-record-file
            - verify: file-content
              target: disposition-record-file
              expected: "every disposition with its term and rationale, verbatim"
    # ===========================================================================
    # Suite 3 — Project-wide, source-aware inbound sweep
    # ===========================================================================
    - kind: presentation
      name: project-wide-source-aware-inbound-sweep
      file: internal/commands/root_retirement_sweep_test.go
      component: cross-cutting/project-wide-source-aware-inbound-sweep
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
      intent: "@parlay-tool/root-retirement/refuse-while-anything-outside-the-root-still-stands-on-it"
      cases:
        - name: a reference held in a third root is found — the sweep is project-wide
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "A reference held in a root other than the retiring one is found; a sweep run against a single root is insufficient and is not what runs."
          exercises: [root-sweep]
          observes: [sweep-findings]
          steps:
            - action: render
              target: root-sweep
              value: "project with a reference to the retiring root held in a sibling root that is neither retiring nor active"
            - verify: state
              target: sweep-findings
              expected: "the sibling-root reference is among the findings"
        - name: an ownership marker on surviving source naming a retiring-root feature blocks
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "An ownership marker on a surviving source file naming a feature of the retiring root blocks the retirement."
          exercises: [root-sweep]
          observes: [sweep-findings, root-sweep]
          steps:
            - action: render
              target: root-sweep
              value: "surviving source file with a parlay-feature: marker naming a retiring-root feature"
            - verify: state
              target: sweep-findings
              expected: "marker reported as a finding"
            - verify: error
              target: root-sweep
              expected: "retirement refused while the finding stands"
        - name: a reference into the root's namespace matching no enumerated feature blocks
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "A reference naming a location in the retiring root's namespace that corresponds to no enumerated feature blocks the retirement."
          exercises: [root-sweep]
          observes: [sweep-findings]
          steps:
            - action: render
              target: root-sweep
              value: "marker naming a path under the retiring root that has no feature directory"
            - verify: state
              target: sweep-findings
              expected: "reported — path-space matching catches what feature enumeration cannot"
        - name: a shipped-guidance instruction naming something only the root provides blocks
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "An instruction in a shipped guidance document naming something only the retiring root provides blocks the retirement."
          exercises: [root-sweep]
          observes: [sweep-findings]
          steps:
            - action: render
              target: root-sweep
              value: "deployed skill document instructing the reader to run a command only the retiring root provides"
            - verify: state
              target: sweep-findings
              expected: "instruction reported as a blocking finding"
        - name: the same instruction in generated document and generating source is two findings
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "The same instruction in a generated document and in the source it is generated from is reported as two findings."
          exercises: [root-sweep]
          observes: [sweep-findings]
          steps:
            - action: render
              target: root-sweep
              value: "instruction present in a deployed module and in its embedded source"
            - verify: count
              target: sweep-findings
              expected: 2
        - name: out-of-root ownership blocks unless a disposition re-homes it
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "An ownership claim by the root's features over work living outside the root blocks the retirement unless a disposition re-homes it."
          exercises: [root-sweep]
          observes: [sweep-findings, root-sweep]
          steps:
            - action: render
              target: root-sweep
              value: "retiring-root feature owning a file outside the root, no re-homing disposition"
            - verify: error
              target: root-sweep
              expected: "blocked on the out-of-root ownership"
            - action: render
              target: root-sweep
              value: "same project, with an authority-re-homed-to disposition covering the file"
            - verify: state
              target: sweep-findings
              expected: "the ownership finding no longer blocks"
        - name: an unreadable or unparseable file is a scan failure that refuses
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "A file that is present but unreadable or unparseable refuses the retirement rather than being passed over."
          exercises: [root-sweep]
          observes: [root-sweep, sweep-failures]
          steps:
            - action: render
              target: root-sweep
              value: "one swept file made unreadable"
            - verify: state
              target: sweep-failures
              expected: "recorded as a scan failure naming the file"
            - verify: error
              target: root-sweep
              expected: "retirement refused — cannot tell is not none"
        - name: narrative prose mentioning the root does not block
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "Narrative prose mentioning the retiring root does not block the retirement."
          exercises: [root-sweep]
          observes: [sweep-findings]
          steps:
            - action: render
              target: root-sweep
              value: "comment and doc prose mentioning the retiring root's name with no instruction and no marker"
            - verify: state
              target: sweep-findings
              expected: "no finding for the prose mentions"
        - name: every finding carries artifact, position, and exact reference
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "Every finding carries owning artifact, position and exact reference."
          exercises: [root-sweep]
          observes: [sweep-findings]
          steps:
            - action: render
              target: root-sweep
              value: "project seeded with findings of each kind"
            - verify: state
              target: sweep-findings
              expected: "each finding names its file, its position within it, and the reference as written"
        - name: the sweep completes before any mutation
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:project-wide-source-aware-inbound-sweep"
            text: "The sweep completes before any mutation."
          exercises: [root-sweep]
          observes: [project-state]
          steps:
            - action: render
              target: root-sweep
              value: "run with findings present, instrumented for write ordering"
            - verify: state
              target: project-state
              expected: "no write of any kind precedes sweep completion"
    # ===========================================================================
    # Suite 4 — Re-home target readiness
    # ===========================================================================
    - kind: presentation
      name: re-home-target-readiness
      file: internal/commands/root_dispositions_test.go
      component: cross-cutting/re-home-target-readiness
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
      intent: "@parlay-tool/root-retirement/refuse-while-anything-outside-the-root-still-stands-on-it"
      cases:
        - name: a re-home target naming no feature refuses
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
            text: "A re-home target that names no feature in the project refuses the retirement."
          exercises: [rehome-readiness]
          observes: [rehome-readiness]
          steps:
            - action: render
              target: rehome-readiness
              value: "authority-re-homed-to naming a feature that exists nowhere in the project"
            - verify: error
              target: rehome-readiness
              expected: "refused — surviving code needs a home that exists before the run"
        - name: a re-home target that is itself retired refuses
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
            text: "A re-home target that is itself retired refuses the retirement."
          exercises: [rehome-readiness]
          observes: [rehome-readiness]
          steps:
            - action: render
              target: rehome-readiness
              value: "target feature with an applied retirement amendment"
            - verify: error
              target: rehome-readiness
              expected: "refused — a retirement record cannot own live code"
        - name: a target with an authored but unapplied retirement refuses
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
            text: "A re-home target carrying an authored but unapplied retirement refuses the retirement."
          exercises: [rehome-readiness]
          observes: [rehome-readiness]
          steps:
            - action: render
              target: rehome-readiness
              value: "target feature whose ledger holds a retirement authored and waiting"
            - verify: error
              target: rehome-readiness
              expected: "refused — authored-and-waiting is not active"
        - name: an active target that does not yet claim the work refuses
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
            text: "A re-home target that exists and is active but does not yet claim the surviving work refuses the retirement."
          exercises: [rehome-readiness]
          observes: [rehome-readiness]
          steps:
            - action: render
              target: rehome-readiness
              value: "surviving file still marked with the retiring root's feature, target active but not claiming it"
            - verify: error
              target: rehome-readiness
              expected: "refused naming the file whose claim has not moved"
        - name: a target satisfying all three conditions permits, checked before any mutation
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
            text: "A re-home target satisfying all three conditions permits the retirement to proceed, and the check runs before any mutation."
          exercises: [rehome-readiness]
          observes: [rehome-readiness, project-state]
          steps:
            - action: render
              target: rehome-readiness
              value: "target exists, is active, and the surviving files already carry its markers"
            - verify: state
              target: rehome-readiness
              expected: "check passes"
            - verify: state
              target: project-state
              expected: "check completed before any mutation occurred"
        - name: target resolution crosses root boundaries
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:re-home-target-readiness"
            text: "Target resolution crosses root boundaries."
          exercises: [rehome-readiness]
          observes: [rehome-readiness]
          steps:
            - action: render
              target: rehome-readiness
              value: "re-home target living in a different root than the retiring feature"
            - verify: state
              target: rehome-readiness
              expected: "resolved across the root boundary"
    # ===========================================================================
    # Suite 5 — Complete-directory archive with manifest
    # ===========================================================================
    - kind: presentation
      name: complete-directory-archive-with-manifest
      file: internal/commands/root_archive_test.go
      component: cross-cutting/complete-directory-archive-with-manifest
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:complete-directory-archive-with-manifest"
      intent: "@parlay-tool/root-retirement/keep-the-roots-work-verifiably-not-merely-out-of-the-way"
      cases:
        - name: every file, configuration and adapters and build state included, is preserved byte-identical
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:complete-directory-archive-with-manifest"
            text: "Every file in the child directory, configuration and adapters and build state included, is present in the preserved copy with identical bytes."
          exercises: [root-archive]
          observes: [archive-contents]
          steps:
            - action: render
              target: root-archive
              value: "child directory with config.yaml, adapters, and build state"
            - verify: file-content
              target: archive-contents
              expected: "every member of the child directory present under contents/ with identical bytes"
        - name: the manifest names every member with its hash and covers itself
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:complete-directory-archive-with-manifest"
            text: "The manifest names every preserved member with its content hash and covers itself."
          exercises: [root-archive]
          observes: [archive-manifest]
          steps:
            - action: render
              target: root-archive
              value: "completed archive"
            - verify: file-content
