schema_version: 3
feature: parlay-tool/root-retirement
framework: "Go stdlib testing (sibling _test.go files per the adapter's tests-alongside convention)"
# Nine suites, one per infrastructure.md fragment. Cases come 1:1 from each
# fragment's Invariants: bullets — the criterion text on every case is the
# bullet's own wording, copied verbatim, with the ref citing the fragment in
# @feature/infrastructure:<fragment-slug> form.
#
# SHAPE NOTE (recorded deliberately): this feature has no surface.yaml and no
# capabilities.yaml, so its criteria live in infrastructure.md Invariants.
# The v2/v3 suite kind: discriminator is closed at {presentation, operation}
# and has no infrastructure member yet — that gap is the subject of the
# specced-but-unbuilt feature parlay-tool/testcases-infrastructure-suite-kind.
# Until it ships, these suites carry kind: presentation with
# component: cross-cutting/<id> and source_refs citing the infrastructure
# fragment, which validates mechanically and keeps full criterion accounting
# (the alternative, the v1 no-kind shape, is testcases-v1-unsupported since
# v0.3). When that feature ships, regenerate this file with kind:
# infrastructure per the regenerate policy.
#
# The steps use the closed testcases vocabulary; for a CLI feature,
# `action: render` with a `value:` carrying the invocation means "run the
# command in this configuration" (the convention established by the
# status-feature-phases and architectural-prose-artifact suites), and
# verify: state/error/file-* assert on the resulting process behavior and
# on-disk effects.
suites:
    # ===========================================================================
    # Suite 1 — Retirement target and destination preconditions
    # ===========================================================================
    - kind: presentation
      name: retirement-target-and-destination-preconditions
      file: internal/commands/retire_root_test.go
      component: cross-cutting/retirement-target-and-destination-preconditions
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
      intent: "@parlay-tool/root-retirement/end-a-subproject-without-pretending-it-never-happened"
      cases:
        - name: a target naming exactly one registered child resolves, naming none refuses with the registered roots enumerated
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A target naming exactly one registered child root resolves; a target naming none is refused and the refusal enumerates the registered roots."
          exercises: [retire-root-preflight]
          observes: [target-resolution, retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> is exactly one registered child"
            - verify: state
              target: target-resolution
              expected: "resolved to the single registered child root"
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> matches no registered child"
            - verify: error
              target: retire-root-preflight
              expected: "refused, and the refusal lists every registered child root by name"
        - name: a target matching more than one candidate is refused without selecting one
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A target matching more than one candidate is refused without selecting one."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> matches two registered children"
            - verify: error
              target: retire-root-preflight
              expected: "refused; no candidate is selected by ordering or proximity"
        - name: an unregistered directory carrying root configuration is refused as a target
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A directory carrying root configuration that is not registered is refused as a target."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where <name> is a directory with .parlay config but no roots.yaml entry"
            - verify: error
              target: retire-root-preflight
              expected: "refused, stating the directory looks like a root but is not registered"
        - name: the parent root holding shared resources and the registration cannot be the target
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "The root holding the shared resources and the root registration cannot be resolved as a target."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> naming the parent root itself"
            - verify: error
              target: retire-root-preflight
              expected: "refused; ending the parent is the project ending, not a subproject ending"
        - name: an existing destination refuses before the root's contents are read
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "An existing destination refuses the run before the root's contents are read."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight, content-reads]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> with .parlay/retired/<name>/ already present"
            - verify: error
              target: retire-root-preflight
              expected: "refused naming the existing destination and both possible explanations"
            - verify: state
              target: content-reads
              expected: "zero reads of the retiring root's contents occurred"
        - name: no enumeration, sweep or content read happens before resolution and destination checks succeed
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "No enumeration, sweep or content read occurs before resolution and destination checking have both succeeded."
          exercises: [retire-root-preflight]
          observes: [content-reads]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root with a failing target resolution, instrumented to record file access"
            - verify: state
              target: content-reads
              expected: "no enumeration, sweep, or content read preceded the resolution and destination checks"
        - name: a registered path resolving outside the project refuses before any enumeration, archive or removal
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A registered path that resolves outside the project refuses the run, and the refusal happens before any enumeration, archive or removal."
          exercises: [retire-root-preflight]
          observes: [target-resolution, project-state]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where the registration records a path resolving outside the project"
            - verify: error
              target: target-resolution
              expected: "refused, stating the registered path does not resolve inside the project"
            - verify: state
              target: project-state
              expected: "no enumeration, archive or removal has occurred"
        - name: an absolute registered path is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "An absolute registered path is refused; a child root is located relative to its parent."
          exercises: [retire-root-preflight]
          observes: [target-resolution]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where the registration records an absolute relative-path"
            - verify: error
              target: target-resolution
              expected: "refused, stating a child root is located relative to its parent"
        - name: a registered path leaving the project through traversal is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A registered path leaving the project through traversal segments is refused."
          exercises: [retire-root-preflight]
          observes: [target-resolution]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where the registration records ../<dir>"
            - verify: error
              target: target-resolution
              expected: "refused, stating the path escapes the project root"
        - name: a registered path that is a link resolving outside the project is refused on the resolved path
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A registered path that is a link resolving outside the project is refused, judged on the resolved path rather than on the name."
          exercises: [retire-root-preflight]
          observes: [target-resolution]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where the registered directory is a symlink to a location outside the project"
            - verify: error
              target: target-resolution
              expected: "refused naming the resolved location outside the project root"
        - name: content outside the project survives a run refused on containment grounds
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "Content outside the project is neither archived nor removed by a run refused on any of these grounds."
          exercises: [retire-root-preflight]
          observes: [project-state]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> for each escaping registration, with populated content at the location the path names"
            - verify: file-content
              target: project-state
              expected: "the content outside the project is byte-identical and still present"
            - verify: state
              target: project-state
              expected: "the project tree is byte-identical"
        - name: the containment judgment is applied again to a path read from a journal
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "The containment judgment is applied again to the path a resumed run reads from its journal, not only to the one it read from the registration."
          exercises: [retirement-journal]
          observes: [retirement-journal, journal-file, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> where an outstanding journal records a path outside the project"
            - verify: error
              target: retirement-journal
              expected: "the resume is refused, stating the journal names a path that is not inside the project"
            - verify: file-content
              target: project-state
              expected: "the location the journal named is untouched"
        - name: a registered root name that is not a plain slug refuses before any mutation
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A registered root name that is not a plain slug refuses the run before any mutation, whatever its registered path says."
          exercises: [retire-root-preflight]
          observes: [target-resolution, project-state]
          steps:
            - action: render
              target: retire-root-preflight
              value: "retire-root <name> where the registration records a traversing name and an ordinary, contained path"
            - verify: error
              target: target-resolution
              expected: "refused, stating the name is not a usable path component"
            - verify: state
              target: project-state
              expected: "the project tree and everything outside it are byte-identical"
        - name: the accepted name shape is a closed slug
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "A name carrying a separator, a traversal segment, a dot, whitespace or upper case is refused; the ordinary names this project produces are accepted."
          exercises: [target-resolution]
          observes: [target-resolution]
          steps:
            - action: render
              target: target-resolution
              value: "each of a traversing, separated, dotted, spaced, upper-cased, dash-edged and empty name, and the ordinary names this project produces"
            - verify: state
              target: target-resolution
              expected: "every malformed name is refused and every ordinary name is accepted"
        - name: destructive steps act through a handle rooted at the project
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "Every destructive step acts through a handle rooted at the project, so a path component replaced with a route out of the project after containment was judged is refused rather than followed, and content outside the project survives the attempt."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a retirement whose intermediate directory is replaced with a link out of the project after containment was judged and before the removal"
            - verify: error
              target: retirement-journal
              expected: "the removal is refused rather than following the link"
            - verify: file-exists
              target: project-state
              expected: "the content outside the project is intact"
        - name: the record, the journal and the registration are written through the rooted handle
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "The retirement record, the journal and the rewritten root registration are written through that same handle: a location swapped for a route out of the project refuses the write rather than landing outside, and nothing is created outside the project by the attempt."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a retirement whose retired-roots location, and then whose .parlay directory, is replaced with a link out of the project immediately before each of the record write, the journal write and the registration rewrite"
            - verify: error
              target: retirement-journal
              expected: "each write is refused rather than following the link"
            - verify: state
              target: project-state
              expected: "nothing is created outside the project"
        - name: the journal removal is rooted on the same terms
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-target-and-destination-preconditions"
            text: "The removal of the journal is rooted on the same terms, so a swapped location cannot make the run delete a file the project does not own."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a retirement whose retired-roots location is replaced with a link to a directory holding a same-named file, immediately before the journal removal"
            - verify: error
              target: retirement-journal
              expected: "the removal is refused"
            - verify: file-exists
              target: project-state
              expected: "the file outside the project is still there"
    # ===========================================================================
    # Suite 2 — Feature disposition preflight
    # ===========================================================================
    - kind: presentation
      name: feature-disposition-preflight
      file: internal/commands/root_dispositions_test.go
      component: cross-cutting/feature-disposition-preflight
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
      intent: "@parlay-tool/root-retirement/say-what-became-of-every-feature-in-the-root"
      cases:
        - name: a complete record with closed-set terms and rationales passes the preflight
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record naming every enumerated feature exactly once, each carrying a term from the closed set and a rationale, passes the preflight."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record covering every enumerated feature exactly once, valid terms, rationales present"
            - verify: state
              target: disposition-preflight
              expected: "preflight passes"
        - name: a record omitting an enumerated feature is refused naming the omitted feature
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record omitting an enumerated feature is refused, naming the omitted feature."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record missing one enumerated feature"
            - verify: error
              target: disposition-preflight
              expected: "refused, and the refusal names the omitted feature"
        - name: a record naming a feature the enumeration did not produce is refused naming it
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record naming a feature the enumeration did not produce is refused, naming it."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record naming one feature that is not in the root"
            - verify: error
              target: disposition-preflight
              expected: "refused, and the refusal names the extra entry"
        - name: a record naming one feature more than once is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record naming one feature more than once is refused."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record naming the same feature twice"
            - verify: error
              target: disposition-preflight
              expected: "refused as a duplicate"
        - name: a term outside the closed set of three is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A term outside the closed set of three is refused."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record with term 'abandoned'"
            - verify: error
              target: disposition-preflight
              expected: "refused, naming the three accepted terms"
        - name: a valid term with no rationale is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A disposition carrying a valid term and no rationale is refused."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record entry with term delivered-and-deleted and empty rationale"
            - verify: error
              target: disposition-preflight
              expected: "refused; a term with no rationale is a classification nobody can check"
        - name: the rationale is never parsed and never widens the accepted terms
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A rationale is never parsed and never widens the accepted terms; the same three terms are accepted whatever any rationale says."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "records whose rationales contain term-like text, YAML syntax, and directives"
            - verify: state
              target: disposition-preflight
              expected: "acceptance decisions identical to the same records with plain rationales; only the three closed terms accepted"
        - name: a delivery that was a removal is recordable as delivered-and-deleted with the rationale carrying the story
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature whose delivery was the removal of something, witnessed only by markers on other features' files that this run deletes, is recordable as delivered-and-deleted with that stated in its rationale."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "record entry: term delivered-and-deleted, rationale describing the retraction and its markers"
            - verify: state
              target: disposition-preflight
              expected: "accepted with no fourth term involved"
        - name: a feature carrying only a placeholder baseline is enumerated and needs a disposition
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature carrying only a placeholder baseline is enumerated and requires a disposition like any other."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "root containing a feature whose only build state is a placeholder baseline; record omits it"
            - verify: error
              target: disposition-preflight
              expected: "refused naming that feature — it is enumerated like any other"
        - name: a feature carrying an incomplete artifact subset is enumerated and needs a disposition
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature carrying an incomplete subset of the build artifacts its siblings carry is enumerated and requires a disposition like any other."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "root where one feature has buildfile only, siblings have buildfile+testcases; record omits it"
            - verify: error
              target: disposition-preflight
              expected: "refused naming that feature"
        - name: buildfile-and-testcases without a coverage review is not classified as unbuilt
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A feature with a buildfile and testcases and no coverage review is not classified as unbuilt on that basis."
          exercises: [disposition-preflight]
          observes: [disposition-preflight]
          steps:
            - action: render
              target: disposition-preflight
              value: "feature with buildfile.yaml and testcases.yaml, no coverage-decisions.yaml, declared delivered-and-deleted"
            - verify: state
              target: disposition-preflight
              expected: "the declared term stands; nothing is inferred from the artifact set"
        - name: no mutation occurs while the preflight is unsatisfied
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "No mutation occurs while the preflight is unsatisfied."
          exercises: [disposition-preflight]
          observes: [project-state]
          steps:
            - action: render
              target: disposition-preflight
              value: "any refused record, followed by a full tree comparison"
            - verify: state
              target: project-state
              expected: "byte-identical to before the run"
        - name: the disposition record is readable alongside the preserved contents after a completed run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "The disposition record, rationales included, is present and readable alongside the preserved contents after a completed run."
          exercises: [disposition-preflight]
          observes: [disposition-record-file]
          steps:
            - action: render
              target: disposition-preflight
              value: "completed retirement"
            - verify: file-exists
              target: disposition-record-file
            - verify: file-content
              target: disposition-record-file
              expected: "every disposition with its term and rationale, verbatim"
        - name: a record carrying an undefined key is refused naming it
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record carrying a key the shape does not define is refused, naming the unrecognized key, rather than decoded with that key dropped."
          exercises: [disposition-preflight]
          observes: [disposition-preflight, disposition-record-file]
          steps:
            - action: render
              target: disposition-preflight
              value: "a record with a misspelled top-level key, and one with a misspelled key inside an entry"
            - verify: error
              target: disposition-preflight
              expected: "each is refused, and the refusal names the key that was not recognized"
        - name: a target under a term that names no target is refused as a contradiction
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A disposition carrying a target under a term that names no target is refused as the contradiction it is."
          exercises: [disposition-preflight]
          observes: [disposition-preflight, disposition-record-file]
          steps:
            - action: render
              target: disposition-preflight
              value: "a record whose delivered-and-deleted and built-but-undelivered entries each carry a target"
            - verify: error
              target: disposition-preflight
              expected: "refused naming the term and the target it contradicts"
        - name: a record saying exactly what its shape defines is accepted unchanged
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A record that says exactly what its shape defines is accepted unchanged by the closed reading."
          exercises: [disposition-preflight]
          observes: [disposition-record-file]
          steps:
            - action: render
              target: disposition-preflight
              value: "a well-formed record with a term, a target and a rationale"
            - verify: state
              target: disposition-record-file
              expected: "loaded, with every field decoded as written"
        - name: an acknowledged reference stops blocking and is listed with its reason
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "An acknowledged reference naming an artifact, a reference and a rationale stops that one finding blocking the retirement, and the preview lists it under its own heading with the reason given rather than dropping it silently."
          exercises: [retire-root-preflight]
          observes: [disposition-preflight, sweep-findings, retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "a preview with a record acknowledging a finding by its artifact and reference"
            - verify: text
              target: retire-root-preflight
              expected: "the finding appears under an acknowledged heading with the rationale given"
            - verify: state
              target: retire-root-preflight
              expected: "it no longer blocks execution"
        - name: an acknowledgment matches only an exact artifact and reference
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "An acknowledgment matches only on an exact artifact and an exact reference; a different path, a different reference or a path that is merely a prefix of the finding's dismisses nothing."
          exercises: [retire-root-preflight]
          observes: [disposition-preflight, retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "runs whose acknowledgment names a different path, a different reference, and a path that is only a prefix of the finding's"
            - verify: error
              target: retire-root-preflight
              expected: "each still refuses naming the finding, since none of the three dismisses it"
        - name: an unacknowledged finding still refuses
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "A finding nobody acknowledged still refuses the retirement, so the dismissal narrows nothing about what is reported."
          exercises: [retire-root-preflight]
          observes: [retire-root-preflight]
          steps:
            - action: render
              target: retire-root-preflight
              value: "a run with two findings and an acknowledgment covering one"
            - verify: error
              target: retire-root-preflight
              expected: "refused naming the unacknowledged finding, and not naming the acknowledged one"
        - name: an incomplete or unrecognized acknowledgment is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:feature-disposition-preflight"
            text: "An acknowledgment carrying no path, no reference, no rationale, or a key the shape does not define, is refused like any other part of the record."
          exercises: [disposition-preflight]
          observes: [disposition-preflight, disposition-record-file]
          steps:
            - action: render
              target: disposition-preflight
              value: "records whose acknowledgment omits the path, the reference, the rationale, and one carrying an undefined key"
            - verify: error
              target: disposition-preflight
