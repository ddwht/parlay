    # ===========================================================================
    # Suite 8 — Mutation order, rollback and the resumable journal
    # ===========================================================================
    - kind: presentation
      name: mutation-order-rollback-and-the-resumable-journal
      file: internal/commands/retirement_journal_test.go
      component: cross-cutting/mutation-order-rollback-resumable-journal
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
      intent: "@parlay-tool/root-retirement/never-leave-a-project-half-retired"
      cases:
        - name: interruption before the archive is complete leaves the project exactly as it was
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "An interruption before the archive is complete leaves the project exactly as it was."
          exercises: [retirement-journal]
          observes: [project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "run interrupted mid-archive"
            - verify: state
              target: project-state
              expected: "byte-identical to before the run"
        - name: interruption after the archive and before registration leaves prior state or a journal
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "An interruption after the archive is complete and before the registration changes leaves either the prior state or an outstanding resumable journal."
          exercises: [retirement-journal]
          observes: [journal-file, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "run interrupted between archive completion and deregistration"
            - verify: file-exists
              target: journal-file
            - verify: state
              target: project-state
              expected: "either restored prior state, or the journal present and the registration still naming the root"
        - name: no interruption leaves registration missing while contents are in place
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "No interruption leaves the registration missing the root while its contents are still in place."
          exercises: [retirement-journal]
          observes: [registration-state]
          steps:
            - action: render
              target: retirement-journal
              value: "interruptions injected at every step boundary"
            - verify: state
              target: registration-state
              expected: "at no point is the root deregistered while its directory is still in place"
        - name: no interruption leaves registration naming the root with contents moved and no journal
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "No interruption leaves the registration naming the root while its contents have moved and no journal exists."
          exercises: [retirement-journal]
          observes: [registration-state, journal-file]
          steps:
            - action: render
              target: retirement-journal
              value: "interruptions injected at every step boundary"
            - verify: state
              target: registration-state
              expected: "whenever contents have moved and the root is still registered, the journal exists"
            - verify: file-exists
              target: journal-file
        - name: the journal lists the outstanding steps in execution order
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "The journal lists the outstanding steps in execution order."
          exercises: [retirement-journal]
          observes: [journal-file]
          steps:
            - action: render
              target: retirement-journal
              value: "post-archive interruption"
            - verify: file-content
              target: journal-file
              expected: "outstanding steps only, in the order they must happen, in actionable terms"
        - name: a resumed run performs outstanding steps and repeats no completed ones
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "A resumed run performs the outstanding steps and does not repeat completed ones."
          exercises: [retirement-journal]
          observes: [retirement-journal, registration-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root re-run with an outstanding journal, then resume confirmed"
            - verify: state
              target: retirement-journal
              expected: "only journal steps executed; the completed archive is not re-attempted"
            - verify: state
              target: registration-state
              expected: "root deregistered; journal removed"
        - name: a second retirement of the same root refuses while a journal is outstanding
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "A second retirement of the same root refuses while a journal is outstanding."
          exercises: [retirement-journal]
          observes: [retirement-journal]
          steps:
            - action: render
              target: retirement-journal
              value: "fresh retire-root of the same root while the journal is outstanding"
            - verify: error
              target: retirement-journal
              expected: "refused naming the part-finished run"
        - name: after a completed run the registration does not name the root
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-and-the-resumable-journal"
            text: "After a completed run the registration does not name the root and no journal outlives it."
          exercises: [retirement-journal]
          observes: [registration-state]
          steps:
            - action: render
              target: retirement-journal
              value: "completed retirement"
            - verify: state
              target: registration-state
              expected: "roots.yaml no longer names the root"
        - name: an in-flight retirement is found by its journal, not through the registration
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "An in-flight retirement is found by its journal without consulting the root registration, and is found equally when named by the root's registered path."
          exercises: [retirement-journal]
          observes: [journal-file, registration-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> after an interruption that already removed the registration"
            - verify: state
              target: journal-file
              expected: "the outstanding journal is found and the run resumes from it"
            - action: render
              target: retirement-journal
              value: "retire-root <relative-path> naming the same in-flight retirement by its registered path"
            - verify: state
              target: journal-file
              expected: "the same journal is found and resumed"
        - name: a run interrupted at any boundary is completed by the next run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A run interrupted at any mutation boundary is completed by the next run, including one interrupted after the registration has already been changed."
          exercises: [retirement-journal]
          observes: [registration-state, journal-file, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a retirement interrupted at each mutation boundary in turn, each followed by a further run"
            - verify: state
              target: registration-state
              expected: "the registration no longer names the root"
            - verify: state
              target: journal-file
              expected: "no journal outlives the completed run"
            - verify: file-exists
              target: project-state
              expected: "the archive holds the contents, the manifest, the dispositions and the retirement record"
        - name: every journal step can be performed again without harm
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "Every step the journal names can be performed again without harm, whatever part of it already succeeded."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a resume of a run whose directory removal and deregistration already succeeded"
            - verify: state
              target: retirement-journal
              expected: "the remaining work completes without repeating or failing on the parts already done"
        - name: a journal that cannot be read refuses the run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal that cannot be read or parsed refuses the run rather than being treated as nothing in flight."
          exercises: [retirement-journal]
          observes: [retirement-journal, journal-file]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with an outstanding journal that cannot be parsed"
            - verify: error
              target: retirement-journal
              expected: "refused naming the journal, rather than starting a fresh run"
        - name: a file in the journal location not named for a root is refused rather than read
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A file in the journal location whose name is not a root name is refused rather than read."
          exercises: [retirement-journal]
          observes: [retirement-journal, journal-file]
          steps:
            - action: render
              target: retirement-journal
              value: "a scan of the journal location holding a file whose name is not a root name"
            - verify: error
              target: retirement-journal
              expected: "refused, stating the filename does not name a root"
        - name: a journal claiming a root other than the one it is filed under is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal recording a root other than the name it is filed under is refused, and nothing is deleted or deregistered on its authority."
          exercises: [retirement-journal]
          observes: [retirement-journal, registration-state, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a genuine journal renamed so its filename no longer names the root it records"
            - verify: error
              target: retirement-journal
              expected: "refused, naming both the root recorded and the name it is filed under"
            - verify: state
              target: project-state
              expected: "the root's directory is still in place and the registration still names it"
        - name: a journal recording a malformed root or an escaping path is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal recording a root that is not a plain slug, or a path that leaves the project, is refused."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a journal recording a traversing root, and one recording a path outside the project"
            - verify: error
              target: retirement-journal
              expected: "each is refused, naming the shape that failed"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: a journal with undefined keys or a second document is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal carrying a key the shape does not define, or more than one document, is refused rather than decoded with the surplus dropped."
          exercises: [retirement-journal]
          observes: [retirement-journal, journal-file]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a journal carrying an undefined key, and one carrying a second YAML document"
            - verify: error
              target: retirement-journal
              expected: "each is refused, naming what was not recognized"
        - name: a journal whose steps are not a tail of the execution order is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal whose outstanding steps are empty, unknown, duplicated or out of the order they must happen in is refused."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a journal whose outstanding steps are in turn empty, unknown, duplicated and reordered"
            - verify: error
              target: retirement-journal
              expected: "each is refused against the order the steps must happen in"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: a journal with no verified archive behind it is refused rather than resumed
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal with no archive at the canonical destination for its root, or whose archive has no manifest that reads back and verifies, is refused rather than resumed — so a hand-written journal cannot retire a live root."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-manifest, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a journal whose archive is absent, one whose archive has no readable manifest, and a hand-written journal naming a live root no retirement ever started"
            - verify: error
              target: retirement-journal
              expected: "each is refused, naming the archive that does not stand behind it"
            - verify: state
              target: project-state
              expected: "the live root is byte-identical and still registered"
        - name: a journal that fails authentication refuses even a run aimed elsewhere
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal that fails authentication refuses the run even when the run was aimed at a different root, and leaves the project unchanged."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <other-root> while an unauthenticatable journal sits in the journal location"
            - verify: error
              target: retirement-journal
              expected: "refused rather than passing the file over on the way to the named target"
            - verify: state
              target: project-state
              expected: "the project tree is byte-identical"
        - name: a journal this operation wrote authenticates and resumes
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal this operation actually wrote authenticates and resumes, and the digest it records survives a completed step."
          exercises: [retirement-journal]
          observes: [retirement-journal, registration-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> against a genuine part-finished retirement"
            - verify: state
              target: retirement-journal
              expected: "the journal authenticates and the outstanding steps complete"
            - verify: state
              target: registration-state
              expected: "the registration no longer names the root"
        - name: a journal must name its archive by the manifest file's digest
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A journal recording no manifest digest, or a digest other than the one the archive's manifest file carries, is refused — a manifest rewritten consistently under a journal no longer matches it."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-manifest, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a journal recording no digest, and again with the manifest rewritten consistently beneath a genuine journal"
            - verify: error
              target: retirement-journal
              expected: "each is refused, the second naming the two digests that disagree"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: archived members are re-hashed against the manifest before the journal is acted on
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "The archived members are re-read and re-hashed against the manifest before the journal is acted on, so archived bytes that changed while the manifest did not are caught."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-manifest, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with an archived member's bytes altered and its manifest left untouched"
            - verify: error
              target: retirement-journal
              expected: "refused, stating the archive does not hold what its manifest describes"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: a manifest naming no members is not a root's archive
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A manifest naming no members is refused as not being a root's archive."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-manifest]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> against an archive whose manifest verifies and names nothing"
            - verify: error
              target: retirement-journal
              expected: "refused, since a root preserves at least its own configuration"
        - name: a step claimed finished must have left its evidence
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A step the journal claims finished must have left its evidence: a finished record step requires a retirement record beside the archive naming the same root and the same path."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> with a journal claiming the record step finished while no record stands, and again with a record describing another retirement"
            - verify: error
              target: retirement-journal
              expected: "each is refused as claimed progress the archive does not show"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: live contents are compared by content, not by name, before they are destroyed
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "While the root's contents are still in place, every live file must hash to the value the manifest records for it, so the run destroys contents only once every one of them is provably in the preserved copy; comparing names alone is not sufficient and is not what happens."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-manifest, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> against a part-finished retirement whose root still holds its contents"
            - verify: state
              target: archive-manifest
              expected: "every live file is hashed and compared against the manifest's recorded hash for the same path"
            - verify: state
              target: project-state
              expected: "the contents are destroyed only once every one of them matches"
        - name: a live file whose bytes differ from the archived copy refuses the run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A live file holding different bytes from its archived copy refuses the run, including when the difference is an honest edit made while the run was interrupted, and the refusal says the archive is stale and the retirement should be run again from what is there."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> after a file in the root was edited while the run was interrupted"
            - verify: error
              target: retirement-journal
              expected: "refused, naming the file and saying the archive is stale and the retirement should be run again"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: a live file the archive does not name refuses the run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A live file the archive does not name at all refuses the run."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <name> after a file appeared in the root that the archive never held"
            - verify: error
              target: retirement-journal
              expected: "refused, naming the file the archive does not hold"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered"
        - name: a forged chain with the right paths and the wrong bytes is refused
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A forged chain naming every live path but holding different bytes — with the manifest, its digest, the record and the journal all recomputed to agree — is refused, because what is checked is the content that would be destroyed rather than the shape of the artifacts."
          exercises: [retirement-journal]
          observes: [retirement-journal, registration-state, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <live-root> against a hand-built chain naming every path the live root holds, with different bytes under each and every artifact recomputed to agree"
            - verify: error
              target: retirement-journal
              expected: "refused, saying the live bytes are not the archived ones"
            - verify: state
              target: registration-state
              expected: "the live root is byte-identical and still registered"
        - name: a byte-identical forged chain passes, and is harmless on those terms
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A forged chain whose archive holds the root's actual bytes satisfies every check, and is harmless on those terms: it has preserved what it proposes to remove, the removal still passes a person, and every destroyed byte is readable in the archive afterwards. Authenticity is not established by any of this and is not claimed."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-contents]
          steps:
            - action: render
              target: retirement-journal
              value: "retire-root <live-root> against a hand-built chain whose archive holds the root's actual bytes, confirmed by a person"
            - verify: state
              target: retirement-journal
              expected: "the checks pass and the run completes"
            - verify: file-content
              target: archive-contents
              expected: "every byte the run destroyed is readable in the archive afterwards"
        - name: a resumed run passes the same authorization a fresh execution does
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "A resumed run passes the same authorization a fresh execution does: unattended it refuses without asking, and attended it proceeds only on an explicit confirmation; a preview of a part-finished run remains available unattended and commits to nothing."
          exercises: [retire-root-authorization]
          observes: [retirement-journal, retire-root-authorization, project-state]
          steps:
            - action: render
              target: retire-root-authorization
              value: "retire-root <name> against a part-finished retirement, unattended and with --non-interactive"
            - verify: error
              target: retire-root-authorization
              expected: "refused without asking a question nobody can answer"
            - action: render
              target: retire-root-authorization
              value: "the same run attended, answering anything other than yes"
            - verify: state
              target: project-state
              expected: "nothing is deleted or deregistered, and a preview leaves the project byte-identical"
        - name: the preservation comparison runs again at the removal itself
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "That comparison is performed again immediately before the removal itself, on every path that reaches it, and not only when the run was admitted — a file written or edited while the confirmation was waiting is content no archive holds."
          exercises: [retirement-journal]
          observes: [retirement-journal, mutation-order, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a fresh run and a resumed run, each reaching the removal step"
            - verify: state
              target: mutation-order
              expected: "the full live-against-manifest and archived-against-manifest comparison runs immediately before the removal on both paths"
            - verify: state
              target: project-state
              expected: "the removal proceeds only when it passes"
        - name: content appearing between authorization and the removal refuses the run
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "Content that appears or changes between authorization and the removal refuses the run, naming the file and the stale-archive remedy, and nothing is removed or deregistered."
          exercises: [retirement-journal]
          observes: [retirement-journal, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a retirement in which a file is edited, and one in which a file is created, in the window between the confirmation and the removal"
            - verify: error
              target: retirement-journal
              expected: "each is refused, naming the file and saying to run the retirement again from what is there"
            - verify: file-exists
              target: project-state
              expected: "the unpreserved file is intact, the root's directory is still in place and the root is still registered"
        - name: an archive altered in that same window aborts the removal
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:mutation-order-rollback-resumable-journal"
            text: "The archived half is re-verified at that same boundary, so an archive altered while the confirmation was waiting aborts the removal too."
          exercises: [retirement-journal]
          observes: [retirement-journal, archive-contents, project-state]
          steps:
            - action: render
              target: retirement-journal
              value: "a retirement whose archived copy is altered in the window between the confirmation and the removal"
            - verify: error
              target: retirement-journal
              expected: "refused, saying the archive no longer matches what it claims to preserve"
            - verify: state
              target: project-state
              expected: "the root's directory is still in place"
    # ===========================================================================
    # Suite 9 — Retirement authorization, preview and unattended runs
    # ===========================================================================
    - kind: presentation
      name: retirement-authorization-preview-and-unattended-runs
      file: internal/commands/retire_root_test.go
      component: cross-cutting/retirement-authorization-preview-unattended
      source_refs:
        - "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
      intent: "@parlay-tool/root-retirement/end-a-subproject-without-pretending-it-never-happened"
      cases:
        - name: a preview on its own leaves the project byte-identical
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "A preview requested on its own leaves the project byte-identical."
          exercises: [retire-root-authorization]
          observes: [project-state]
          steps:
            - action: render
              target: retire-root-authorization
              value: "retire-root <name> --preview, then full tree comparison"
            - verify: state
              target: project-state
              expected: "byte-identical — nothing written, nothing reserved, no state behind"
        - name: execution proceeds only after explicit authorization following a shown preview
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "Execution proceeds only after explicit authorization following a shown preview."
          exercises: [retire-root-authorization]
          observes: [retire-root-authorization, project-state]
          steps:
            - action: render
              target: retire-root-authorization
              value: "interactive run answering the confirmation with no"
            - verify: state
              target: project-state
              expected: "nothing changed"
            - action: render
              target: retire-root-authorization
              value: "interactive run answering the confirmation with yes"
            - verify: state
              target: retire-root-authorization
              expected: "execution proceeded, after the preflight report was shown"
        - name: an unattended execution refuses, writes nothing, and states the missing person as the reason
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "An unattended execution refuses and writes nothing, and says that the absence of a person is the reason."
          exercises: [retire-root-authorization]
          observes: [retire-root-authorization, project-state]
          steps:
            - action: render
              target: retire-root-authorization
              value: "retire-root <name> --non-interactive"
            - verify: error
              target: retire-root-authorization
              expected: "refused, the message naming the absence of a person to authorize as the reason"
            - verify: state
              target: project-state
              expected: "nothing written"
        - name: an unattended preview succeeds and writes nothing
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "An unattended preview succeeds and writes nothing."
          exercises: [retire-root-authorization]
          observes: [retire-root-authorization, project-state]
          steps:
            - action: render
              target: retire-root-authorization
              value: "retire-root <name> --preview --non-interactive"
            - verify: state
              target: retire-root-authorization
              expected: "preview reported, exit zero"
            - verify: state
              target: project-state
              expected: "nothing written"
        - name: retiring a root whose features have artifacts is permitted
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "Retiring a root whose features have artifacts is permitted by this operation."
          exercises: [retire-root-authorization]
          observes: [retire-root-authorization]
          steps:
            - action: render
              target: retire-root-authorization
              value: "root whose features carry buildfiles, testcases, and generated code; authorized run"
            - verify: state
              target: retire-root-authorization
              expected: "the retirement proceeds — built features do not block root retirement"
        - name: retiring one of those features on its own remains refused with its existing reason and message
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "Retiring one of those features on its own remains refused with its existing reason and message."
          exercises: [feature-retirement-refusal]
          observes: [feature-retirement-refusal]
          steps:
            - action: render
              target: feature-retirement-refusal
              value: "feature-level retirement of a built feature via the existing amendment path"
            - verify: error
              target: feature-retirement-refusal
              expected: "still refused by feature-retirement-has-output, with its existing message unchanged"
        - name: the retirement record is not accepted as the owner of any surviving work
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:retirement-authorization-preview-and-unattended-runs"
            text: "The retirement record is not accepted as the owner of any surviving work."
          exercises: [retire-root-authorization]
          observes: [rehome-validation]
          steps:
            - action: render
              target: retire-root-authorization
              value: "disposition attempting to re-home surviving work to the retirement record itself"
            - verify: error
              target: rehome-validation
              expected: "refused — only a live feature can own surviving work; a record of an ending cannot"
