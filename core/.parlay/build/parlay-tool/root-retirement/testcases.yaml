              value: "ordinary-looking name resolving outside; traversal-laden name resolving inside"
            - verify: error
              target: archive-walk
              expected: "the ordinary-looking escape aborts"
            - verify: state
              target: archive-contents
              expected: "the traversal-laden inside path is preserved"
        - name: an unreadable member aborts before anything is written
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:escaping-paths-and-unreadable-members-fail-closed"
            text: "A member that cannot be read aborts the run before anything is written."
          exercises: [archive-walk]
          observes: [archive-walk, project-state]
          steps:
            - action: render
              target: archive-walk
              value: "one member with permissions removed"
            - verify: error
              target: archive-walk
              expected: "aborted on the unreadable member"
            - verify: state
              target: project-state
              expected: "nothing written"
        - name: neither condition is ever resolved by skipping the member and continuing
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:escaping-paths-and-unreadable-members-fail-closed"
            text: "Neither condition is ever resolved by skipping the member and continuing."
          exercises: [archive-walk]
          observes: [archive-contents]
          steps:
            - action: render
              target: archive-walk
              value: "walk over a directory with an escaping and an unreadable member"
            - verify: state
              target: archive-contents
              expected: "no archive claiming completeness exists with either member silently absent"
        - name: a run aborted by either condition leaves the project exactly as it was
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:escaping-paths-and-unreadable-members-fail-closed"
            text: "A run aborted by either condition leaves the project exactly as it was, with no archive, no record and no change to the root registration."
          exercises: [archive-walk]
          observes: [project-state]
          steps:
            - action: render
              target: archive-walk
              value: "aborted runs of both kinds, followed by full tree comparison"
            - verify: state
              target: project-state
              expected: "no archive, no record, registration unchanged, tree byte-identical"
        - name: the refusal names the member that caused it
          criterion:
            ref: "@parlay-tool/root-retirement/infrastructure:escaping-paths-and-unreadable-members-fail-closed"
            text: "The refusal names the member that caused it."
          exercises: [archive-walk]
          observes: [archive-walk]
          steps:
            - action: render
              target: archive-walk
              value: "aborted runs of both kinds"
            - verify: error
              target: archive-walk
              expected: "each refusal names the offending member's path"
