schema_version: 1
feature: notes

# The backend operations this feature exposes. Terms are validated by UNION
# coverage: each term must be supported by at least one filled backend adapter.
# So validate-input + auth-required (application-owned, in nestjs-application
# only) coexist with create-one (persistence-owned, in prisma-postgres only) —
# something the old intersection gate wrongly rejected.
operations:
  - id: notes.create-note
    kind: command
    subject: { entity: Note }
    input: { type: CreateNoteInput }
    output: { shape: one, entity: Note }
    steps:
      - { type: validate-input }
      - { type: create-one, entity: Note }
      - { type: return-one, entity: Note }
    errors: [validation-failed, conflict, server-error]
    policies: [auth-required]

  - id: notes.list-notes
    kind: query
    subject: { entity: Note }
    output: { shape: many, entity: Note }
    steps:
      - { type: read-many, entity: Note }
      - { type: return-many, entity: Note }
    errors: [server-error]
    policies: []
