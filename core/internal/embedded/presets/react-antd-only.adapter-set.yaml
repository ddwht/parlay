# parlay-section: cross-cutting
# parlay-feature: parlay-tool/multi-adapter
#
# Presentation-only preset. Single slot; no supports/links validation.
# Suitable for back-compat projects whose codegen target is purely UI.

name: react-antd-only

targets:
  presentation:
    adapter: react-antd
    # "." — root names the deployable project location, and a single-package
    # app's is the repo itself. It used to say "src", which is the framework's
    # source directory: substituting that for the adapter's source-root made
    # react-antd's src/ collapse onto itself and dropped angular's app/
    # entirely, so angular-clarity-only emitted to src/features/ instead of
    # src/app/features/. react-antd-only was correct only because "src" and
    # its adapter's source-root happened to be the same string.
    root: "."
